<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">

<title>FrotaCheck · B. Group</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js" onerror="void 0"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#16202e;--mut:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri2:#dbeafe;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--info:#0369a1;--infobg:#e0f2fe}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:#0f172a;color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;min-height:52px}
header h1{font-size:17px;margin:0;flex:1}
header small{color:#94a3b8;font-size:11px;display:block;font-weight:400}
header .me{font-size:12px;text-align:right;cursor:pointer}
.bell{position:relative;background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:6px}
.bell b{position:absolute;top:0;right:-2px;background:#dc2626;color:#fff;font-size:11px;border-radius:99px;padding:1px 6px;min-width:18px}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:52px;z-index:19}
nav button{border:0;background:none;padding:9px 11px;border-radius:8px;font-size:14px;color:var(--mut);white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px}
h2{margin:6px 0 12px;font-size:20px}
h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat b{display:block;font-size:26px}.stat span{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:9px;font-size:14px;cursor:pointer;font-weight:500;min-height:42px}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.okb{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ghost{background:none;border-style:dashed;color:var(--mut)}
.btn.sm{padding:6px 10px;font-size:13px;min-height:34px}
.btn.big{width:100%;padding:15px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:8px 0}
label.ck input{width:20px;height:20px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:#fff;font-family:inherit}
textarea{min-height:64px}
.fsec{margin:16px 0 0;padding-top:10px;border-top:1px solid var(--line);font-weight:600;font-size:14px;color:var(--pri)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-info{background:var(--infobg);color:var(--info)}.b-mut{background:#e2e8f0;color:#475569}
.mut{color:var(--mut)}.small{font-size:13px}
table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps div{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:8px;background:#e2e8f0;color:var(--mut)}
.steps div.on{background:var(--pri);color:#fff;font-weight:600}.steps div.done{background:var(--okbg);color:var(--ok)}.steps div.skip{background:var(--warnbg);color:var(--warn)}
.dots{display:flex;gap:5px;margin:8px 0}
.dots i{flex:1;height:8px;border-radius:4px;background:#cbd5e1;cursor:pointer}.dots i.done{background:var(--ok)}.dots i.skip{background:#f59e0b}.dots i.cur{outline:2px solid var(--pri)}
.tips li{margin:6px 0}
.imgbox{position:relative;border-radius:10px;overflow:hidden;background:#1e293b;line-height:0}
.imgbox img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.imgbox .cell{position:absolute;width:12.5%;height:16.6667%;border:1px solid rgba(220,38,38,.9);pointer-events:none}
.imgbox .tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;line-height:1.4}
.imgbox .empty{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;line-height:1.3;text-align:center;padding:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{border:1px solid #cbd5e1;background:#fff;padding:9px 13px;border-radius:8px;cursor:pointer;font-size:14px;min-height:40px}
.seg button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.seg button.on.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.seg button.on.is{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.gauge{display:inline-block;width:70px;height:10px;border-radius:5px;background:#e2e8f0;vertical-align:middle;overflow:hidden;position:relative}
.gauge i{position:absolute;left:0;top:0;bottom:0}.gauge:after{content:'';position:absolute;left:25%;top:0;bottom:0;width:1px;background:#0f172a55}
.tlh{display:flex;font-size:10px;color:var(--mut);margin-left:110px}.tlh span{flex:1;border-left:1px solid var(--line);padding-left:2px}
.tlr{display:flex;align-items:center;margin:4px 0}.tlr .lb{width:110px;font-size:12px;flex:none;padding-right:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{position:relative;height:34px;background:#f1f5f9;border-radius:6px;flex:1}
.tl .plan{position:absolute;top:2px;bottom:2px;border:1.5px dashed #94a3b8;border-radius:5px;background:rgba(148,163,184,.08)}
.tl .bar{position:absolute;top:6px;bottom:6px;border-radius:5px;font-size:11px;color:#fff;overflow:hidden;white-space:nowrap;padding:0 4px;line-height:22px;cursor:pointer;min-width:4px}
.tl .mnt{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 6px,#cbd5e1 6px,#cbd5e1 12px);border-radius:5px;font-size:10px;color:#475569;padding:0 4px;line-height:34px;overflow:hidden;white-space:nowrap}
.tl .now{position:absolute;top:0;bottom:0;width:2px;background:#dc2626}
.vopt{border:2px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.vopt.sel{border-color:var(--pri);background:#f8fbff}.vopt.dis{opacity:.6}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;z-index:50;overflow:auto;padding:14px}
#modal.on{display:block}
#modal .box{background:#fff;border-radius:14px;max-width:860px;margin:0 auto;padding:16px}
#cam{position:fixed;inset:0;background:#000;z-index:80;display:none}
#cam.on{display:block}
#cam video,#cam img.ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam img.ghost{opacity:.35;pointer-events:none}
#cam .top{position:absolute;top:0;left:0;right:0;padding:12px;background:linear-gradient(#000c,#0000);color:#fff;font-size:14px}
#cam .bot{position:absolute;bottom:0;left:0;right:0;padding:14px;display:flex;justify-content:space-around;align-items:center;gap:6px;background:linear-gradient(#0000,#000c);flex-wrap:wrap}
#cam .shot{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #94a3b8;cursor:pointer}
#cam .grid3{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33%,#fff3 33%,#fff3 calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,#fff3 66%,#fff3 calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(transparent 33%,#fff3 33%,#fff3 calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,#fff3 66%,#fff3 calc(66% + 1px),transparent calc(66% + 1px))}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 16px;border-radius:10px;display:none;z-index:99;max-width:92%;cursor:pointer}
#busy{position:fixed;inset:0;background:#fff9;z-index:90;display:none;align-items:center;justify-content:center;font-weight:600}
.warnbox{background:var(--warnbg);color:var(--warn);padding:9px 11px;border-radius:8px;font-size:13px;margin-top:8px}
.okbox{background:var(--okbg);color:var(--ok);padding:9px 11px;border-radius:8px;font-size:13px;margin-top:8px}
.badbox{background:var(--badbg);color:var(--bad);padding:9px 11px;border-radius:8px;font-size:13px;margin-top:8px}
.infobox{background:var(--infobg);color:var(--info);padding:9px 11px;border-radius:8px;font-size:13px;margin-top:8px}
.thumbs{display:flex;gap:4px;flex-wrap:wrap}.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:5px;cursor:pointer;background:#e2e8f0}
.al{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.nt{padding:10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}.nt.unread{background:#eff6ff}.nt.alta.unread{background:#fef2f2}
.demo{background:#fbbf24;color:#422006;text-align:center;font-size:12px;padding:4px}
.login{max-width:380px;margin:40px auto}
.pin{font-size:26px;letter-spacing:10px;text-align:center}
.term{border:2px solid var(--bad);background:#fff7f7;border-radius:10px;padding:12px;font-size:15px;line-height:1.45}
.onlyprint{display:none}
/* v4 */
.mk{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:3px solid #f59e0b;border-radius:50%;box-shadow:0 0 0 2px #fff;pointer-events:none}
.dbox{position:absolute;border:2px solid #dc2626;background:rgba(220,38,38,.16);border-radius:3px;pointer-events:none}
.chip{display:inline-block;padding:7px 12px;border:1px solid #cbd5e1;border-radius:99px;background:#fff;cursor:pointer;font-size:13px;margin:0 4px 6px 0}.chip.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.tag2{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#e2e8f0;color:#334155;margin-right:4px}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;display:block;background:none;padding:0;overflow:visible}#modal .box{max-width:none;padding:0}.noprint{display:none!important}.onlyprint{display:block}.card{break-inside:avoid}}
@media(max-width:560px){.f2{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<div id="demoBar" class="demo" style="display:none">MODO DEMONSTRAÇÃO · NADA É SALVO: os dados são fictícios e somem ao fechar · preencha SUPABASE_URL e SUPABASE_ANON_KEY no config.js</div>
<header><h1>🚚 FrotaCheck<small id="hsub">B. Group · gestão de frota</small></h1><button class="bell" id="bell" style="display:none" onclick="openNotifs()" aria-label="Notificações">🔔<b id="bellN" style="display:none">0</b></button><div class="me" id="meBox"></div></header>
<nav id="nav" style="display:none"></nav>
<main id="main"><div class="card" style="text-align:center">Carregando...</div></main>
<div id="modal"></div>
<div id="cam"></div>
<div id="toast" onclick="this.style.display='none'"></div>
<div id="busy"><div class="card" id="busyTxt">Aguarde...</div></div>
<input type="file" id="fileIn" accept="image/*" capture="environment" style="display:none">
<script>
/* =====================================================================
   CONFIGURAÇÃO — preencha com os dados do seu projeto Supabase
   (Supabase > Project Settings > API). Sem URL, o app abre em MODO DEMO.
   ===================================================================== */
const CONFIG={
  SUPABASE_URL:'',                 // ex.: 'https://abcdefgh.supabase.co'
  SUPABASE_ANON_KEY:'',            // chave "anon public" (NUNCA a service_role)
  EMAIL_DOMAIN:'frota.bgroup.app', // domínio interno fictício do login por cartão
  EMPRESA:'B. Group',
  VEHICLE_TYPES:['Indiferente','Hatch/compacto','Sedã','SUV','Picape/caminhonete (caçamba)','Utilitário/van'],
  FUEL_ALERT_KM:100,               // alerta quando faltar menos que isso para 1/4 do tanque
  NIGHT_HOURS:[18,6],              // entre 18h e 6h o app sugere flash/lanterna
  AI_COMPARE_LOCAL:false,            // com IA ativa, roda também o analisador local e guarda a comparação no feedback (mais lento)
  AI_ENGINE:'local',               // 'local' (no aparelho) | 'edge' (Supabase Edge Function analyze-photos, com fallback local)
  VAPID_PUBLIC_KEY:'',             // chave pública VAPID para Web Push (veja LEIAME.md)
  ALERTS_FALLBACK_MIN:15,          // app do gestor roda os alertas periódicos se o pg_cron não estiver ativo
  TEST_PHOTOS:false,               // mostra botões de "foto de teste" também no modo real
  CAR_DETECTOR:true,               // análise de fotos: localiza o veículo (carrega ~6 MB da pasta ml/ na 1ª vez) e avalia só a lataria; false = modo reserva sem detector
  CONSUMPTION_ALERT_PCT:25,        // alerta quando o km/L do último intervalo (tanque cheio→cheio) ficar X% abaixo do rendimento cadastrado
  DIVERGENCE:{KM_PCT:25,KM_ABS:15,KM_GAP:10,TIME_MIN:60,MAX_AVG_KMH:90}  // tolerâncias da tela Divergências (ajuste conforme a operação)
};
// config.js (arquivo à parte, preenchido uma vez) tem prioridade sobre os valores deste arquivo
if(window.FC_CONFIG)for(const [k,v] of Object.entries(window.FC_CONFIG))if(v!==''&&v!=null)CONFIG[k]=v;
// tolera espaços, barra final ou caminho colado por engano (ex.: https://xxxx.supabase.co/rest/v1/) e espaços na chave
CONFIG.SUPABASE_URL=String(CONFIG.SUPABASE_URL||'').trim().replace(/^(https?:\/\/[^\/\s]+).*$/i,'$1');CONFIG.SUPABASE_ANON_KEY=String(CONFIG.SUPABASE_ANON_KEY||'').replace(/\s+/g,'');
const DEMO=!CONFIG.SUPABASE_URL||new URLSearchParams(location.search).has('demo');

/* ======================= utilidades ======================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^Math.random()*16>>c/4).toString(16));
const nowISO=()=>new Date().toISOString();
const p2=n=>String(n).padStart(2,'0');
const localDate=d=>{d=new Date(d);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const today=()=>localDate(new Date());
const localInput=d=>{d=new Date(d);return `${localDate(d)}T${p2(d.getHours())}:${p2(d.getMinutes())}`};
const fmtD=i=>i?new Date(String(i).length===10?i+'T12:00:00':i).toLocaleDateString('pt-BR'):'-';
const fmtDT=i=>i?new Date(i).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';
const fmtT=i=>i?new Date(i).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'-';
const fmtKm=n=>n==null||n===''?'-':Number(n).toLocaleString('pt-BR')+' km';
const brl=n=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const daysTo=d=>d?Math.ceil((new Date(String(d).length===10?d+'T12:00:00':d)-new Date())/864e5):null;
const addMonths=(d,m)=>{const x=new Date(d+'T12:00:00');x.setMonth(x.getMonth()+Number(m));return localDate(x)};
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+Number(n));return localDate(x)};
const hrs=(a,b)=>(new Date(b)-new Date(a))/36e5;
const fmtDur=h=>{const m=Math.round(h*60);return m<60?m+' min':Math.floor(m/60)+'h'+(m%60?p2(m%60):'')};
const normCard=s=>String(s||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}
function busy(on,txt){$('#busy').style.display=on?'flex':'none';if(txt)$('#busyTxt').textContent=txt}
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
async function dataURLtoBlob(u){return (await fetch(u)).blob()}
const isNight=(d=new Date())=>{const h=d.getHours();return h>=CONFIG.NIGHT_HOURS[0]||h<CONFIG.NIGHT_HOURS[1]};

/* ======================= domínio ======================= */
const FUEL=[{v:.125,l:'Reserva'},{v:.25,l:'1/4'},{v:.5,l:'1/2'},{v:.75,l:'3/4'},{v:1,l:'Cheio'}];
const fuelL=v=>{if(v==null)return'-';let b=FUEL[0];for(const f of FUEL)if(Math.abs(f.v-v)<Math.abs(b.v-v))b=f;return b.l};
const gauge=v=>`<span class="gauge" title="${fuelL(v)}"><i style="width:${Math.round((v||0)*100)}%;background:${v<=.25?'#dc2626':v<=.5?'#f59e0b':'#16a34a'}"></i></span> ${fuelL(v)}`;
const ROLE={condutor:'Condutor',recepcao:'Recepção',gestor:'Gestor de frota'};
const BST={solicitada:['Aguardando aprovação','b-info'],aprovada:['Aprovada','b-ok'],recusada:['Recusada','b-mut'],cancelada:['Cancelada','b-mut'],chave_retirada:['Chave retirada','b-warn'],em_uso:['Em uso','b-warn'],devolvido:['Devolvido (chave pendente)','b-warn'],concluido:['Concluído','b-ok'],nao_compareceu:['Não compareceu','b-mut']};
const ACTIVE=['aprovada','chave_retirada','em_uso'];          // ocupam o veículo
const FINAL=['concluido','cancelada','recusada','nao_compareceu'];
const bBadge=b=>{let [l,c]=BST[b.status]||[b.status,'b-mut'];if(b.status==='em_uso'&&new Date(b.end_at)<new Date()){l='Em uso · atrasado';c='b-bad'}
 if(b.status==='solicitada'&&b.adjust_requested_at){l='Ajuste solicitado';c='b-warn'}return `<span class="badge ${c}">${l}</span>`+((b.flags||[]).includes('vistoria_incompleta')?' <span class="badge b-bad">Vistoria incompleta</span>':'')};
/* checklist v3: apenas 3 itens */
const CHECKS=[['pneus','Pneus (visual / calibragem aparente)'],['farois','Faróis'],['docs','Documento do veículo (CRLV)']];
/* fotos v3: 5 ângulos, na retirada e na devolução */
const ANGLES=[
 {k:'frente',l:'Frente (faróis acesos)',pos:[60,8],t:'Ligue o carro e acenda os faróis antes de fotografar. Fique a ~3 m, de frente e centralizado; enquadre o veículo inteiro com a placa dianteira legível.'},
 {k:'lat_esq',l:'Lateral esquerda',pos:[6,80],t:'A ~3 m, exatamente de lado (90°), na altura do peito. Enquadre de ponta a ponta: portas, rodas, retrovisor e para-choques.'},
 {k:'traseira',l:'Traseira',pos:[60,152],t:'A ~3 m, centralizado atrás do veículo. Enquadre o carro inteiro com a placa traseira legível.'},
 {k:'lat_dir',l:'Lateral direita',pos:[114,80],t:'A ~3 m, exatamente de lado (90°), na altura do peito. Enquadre de ponta a ponta: portas, rodas, retrovisor e para-choques.'},
 {k:'painel',l:'Painel (carro ligado)',pos:[60,62],t:'Ligue o carro: KM, marcador de combustível e luzes de alerta precisam estar acesos e legíveis. Fotografe de frente, sem reflexo.'}
];
const angL=k=>ANGLES.find(a=>a.k===k)?.l||({frente_esq:'Frente-esquerda',tras_esq:'Traseira-esquerda',tras_dir:'Traseira-direita',frente_dir:'Frente-direita',interior:'Interior'}[k])||k||'Geral';
const MKIND={oleo:'Troca de óleo',pneus:'Troca de pneus',calibragem:'Calibragem de pneus',preventiva:'Manutenção preventiva',corretiva:'Manutenção corretiva',outro:'Outro'};
const SKIP_TEXT='Você está seguindo com o uso do veículo sem o registro completo das fotos/checklist. Ao confirmar, você assume a responsabilidade pelo estado do veículo e por qualquer avaria identificada posteriormente que possa ter ocorrido durante este uso.';
const REGION=(cx,cy)=>{const c=cx<3?'esquerda':cx>4?'direita':'centro',r=cy<2?'superior':cy>3?'inferior':'central';return r==='central'&&c==='centro'?'região central':`região ${r} ${c}`};

// Programação (est_km) inferior a 100 km: a solicitação é recebida e aprovada pela recepção (sem km informado, decide o gestor)
const receptionEligible=b=>b.est_km!=null&&b.est_km!==''&&Number(b.est_km)<100;
// Rodízio municipal de São Paulo (CET): seg–sex, 7h–10h e 17h–20h, por final de placa. Não considera feriados/suspensões.
// (mesma regra de fc_rodizio_check() no banco; usa o fuso do aparelho, como o restante do app)
const RODIZIO={faixas:[['07:00','10:00'],['17:00','20:00']],finais:{1:[1,2],2:[3,4],3:[5,6],4:[7,8],5:[9,0]}};
function rodizioCheck(plate,startISO,endISO,exempt){
 if(exempt)return{restricted:false,exempt:true,digit:null,windows:[]};
 const m=/(\d)$/.exec(String(plate||''));if(!m)return{restricted:null,exempt:false,digit:null,windows:[]};
 const dg=Number(m[1]),s=new Date(startISO),e=new Date(endISO);
 if(isNaN(s)||isNaN(e)||e<=s)return{restricted:false,exempt:false,digit:dg,windows:[]};
 const w=[];let d=localDate(s);const d1=localDate(e);
 for(let n=0;d<=d1&&n<62;n++,d=addDays(d,1)){const dow=new Date(d+'T12:00:00').getDay();if(dow<1||dow>5||!RODIZIO.finais[dow].includes(dg))continue;
  for(const [f,t] of RODIZIO.faixas){const ws=new Date(d+'T'+f+':00'),we=new Date(d+'T'+t+':00');if(s<we&&ws<e)w.push({date:d,from:f,to:t})}}
 return{restricted:w.length>0,exempt:false,digit:dg,windows:w}}
const rodNote=r=>!r?null:r.exempt?'isento do rodízio':r.restricted===null?'placa sem final numérico: confira o rodízio manualmente':r.restricted?'restrito: '+r.windows.map(x=>`${x.date.slice(8)}/${x.date.slice(5,7)} ${x.from}–${x.to}`).join(', '):'sem restrição no período';
// última terça ou quinta (inclusive hoje): data de referência do checklist NOSBEB
const lastDue=d=>{const k=new Date(d+'T12:00:00').getDay()||7;return addDays(d,-({1:4,2:0,3:1,4:0,5:1,6:2,7:3}[k]))};
const fleetFlag=(v,companies)=>!!(v&&(v.fleet_controls??companies.find(c=>c.id===v.company_id)?.fleet_controls));
// consumo (tanque cheio → tanque cheio): km rodados ÷ litros abastecidos desde o cheio anterior (parciais entram na soma). Mesma regra da view fc_refuel_consumption.
function consumptionSeries(refuels){const by={};
 [...refuels].sort((a,b)=>a.created_at<b.created_at?-1:a.created_at>b.created_at?1:a.id<b.id?-1:1).forEach(r=>(by[r.vehicle_id]=by[r.vehicle_id]||[]).push(r));
 const out=[];for(const L of Object.values(by)){let pf=-1;L.forEach((r,i)=>{let kd=null,lu=null,cu=null,k=null;
  if(Number(r.level_after)>=1&&pf>=0){kd=r.km!=null&&L[pf].km!=null?r.km-L[pf].km:null;const seg=L.slice(pf+1,i+1);lu=seg.reduce((s,x)=>s+(Number(x.liters)||0),0);cu=seg.reduce((s,x)=>s+(Number(x.cost)||0),0);if(kd>0&&lu>0)k=Math.round(kd/lu*100)/100}
  out.push({...r,km_driven:kd,liters_used:lu,cost_used:cu,kml:k});if(Number(r.level_after)>=1)pf=i})}
 return out}

/* ======================= camada de dados: SUPABASE ======================= */

 err(e){if(!e)return;const m=e.message||String(e);
  if(e.code==='23P01'||/bookings_no_overlap/.test(m))return new Error('Este veículo já está reservado nesse horário.');

  if(/row-level security|permission denied/i.test(m))return new Error('Sem permissão para esta ação.');
  return new Error(m)}
 async login(card,pin){const {error}=await this.c.auth.signInWithPassword({email:this.email(card),password:this.pw(card,pin)});if(error)throw new Error('Cartão ou PIN inválido.');const me=await this.me();if(!me)throw new Error('Usuário sem cadastro no app. Procure o gestor de frota.');if(!me.active){await this.logout();throw new Error('Usuário desativado.')}return me}

 async logout(){this.unsubscribe();await this.c.auth.signOut()}
 async select(t,q={}){let r=this.c.from(t).select('*');for(const [op,col,val] of (q.f||[]))r=r[op](col,val);if(q.order)r=r.order(q.order,{ascending:!q.desc});if(q.limit)r=r.limit(q.limit);const {data,error}=await r;if(error)throw this.err(error);return data}
 async insert(t,row){const {data,error}=await this.c.from(t).insert(row).select().single();if(error)throw this.err(error);return data}
 async update(t,id,patch){const {data,error}=await this.c.from(t).update(patch).eq('id',id).select().maybeSingle();if(error)throw this.err(error);return data}
 async del(t,id){const {error}=await this.c.from(t).delete().eq('id',id);if(error)throw this.err(error)}
 async delInspections(ids){const {data:rows}=await this.c.from('inspections').select('id,photos,extras').in('id',ids);const paths=[];(rows||[]).forEach(i=>{Object.values(i.photos||{}).forEach(p=>p&&paths.push(p));(i.extras||[]).forEach(e=>e&&e.path&&paths.push(e.path))});
  const {data,error}=await this.c.from('inspections').delete().in('id',ids).select('id');if(error)throw this.err(error);if(!data||data.length<ids.length)throw new Error('Sem permissão para excluir (apenas o gestor) ou vistoria já removida');
  if(paths.length){const {error:se}=await this.c.storage.from('vistorias').remove(paths);if(se)console.warn('fotos não removidas',se)}}
 async delChecklists(ids){const {data:rows}=await this.c.from('nosbeb_checklists').select('id,water_photo,oil_photo,photos,items').in('id',ids);const paths=[];(rows||[]).forEach(k=>{[k.water_photo,k.oil_photo].forEach(p=>p&&paths.push(p));Object.values(k.photos||{}).forEach(p=>p&&paths.push(p));Object.values(k.items||{}).forEach(it=>(it&&it.photos||[]).forEach(p=>p&&paths.push(p)))});
  const {data,error}=await this.c.from('nosbeb_checklists').delete().in('id',ids).select('id');if(error)throw this.err(error);if(!data||data.length<ids.length)throw new Error('Sem permissão para excluir (apenas o gestor) ou checklist já removido');
  if(paths.length){const {error:se}=await this.c.storage.from('vistorias').remove(paths);if(se)console.warn('fotos não removidas',se)}}
 async rpc(fn,args={}){const {data,error}=await this.c.rpc(fn,args);if(error)throw this.err(error);return data}
 async upload(path,blob){// idempotente: caminho determinístico por vistoria; reenvio de arquivo existente é ignorado
  for(let t=0;t<3;t++){const {error}=await this.c.storage.from('vistorias').upload(path,blob,{contentType:'image/jpeg',upsert:false});
   if(!error||/exist|duplicate/i.test(error.message))return path;if(t===2)throw this.err(error);await new Promise(r=>setTimeout(r,800*(t+1)))}}
 async photoUrl(path){const c=this.urls[path];if(c&&c.exp>Date.now())return c.url;const {data,error}=await this.c.storage.from('vistorias').createSignedUrl(path,3600);if(error)return'';this.urls[path]={url:data.signedUrl,exp:Date.now()+3300e3};return data.signedUrl}
 async photoBlob(path){const {data,error}=await this.c.storage.from('vistorias').download(path);if(error)throw this.err(error);return data}
 async createUser(p,pin){
  const tmp=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'fc-tmp'}});
  const {data,error}=await tmp.auth.signUp({email:this.email(p.card),password:this.pw(p.card,pin)});

  if(!data.session)throw new Error('Usuário criado, mas o Supabase exige confirmação de e-mail. Desative "Confirm email" em Authentication > Providers > Email.');
  return this.insert('profiles',{...p,id:data.user.id})}
 async resetPin(id,pin){return this.rpc('set_user_pin',{p_user:id,p_pin:pin})}
 async changeMyPin(card,pin){const {error}=await this.c.auth.updateUser({password:this.pw(card,pin)});if(error)throw this.err(error)}
 async bootstrapNeeded(){return this.rpc('no_profiles')}
 async bootstrap(p,pin){const {data,error}=await this.c.auth.signUp({email:this.email(p.card),password:this.pw(p.card,pin)});if(error)throw this.err(error);
  if(!data.session)throw new Error('Desative "Confirm email" no Supabase (Authentication > Providers > Email) e tente de novo.');
  await this.insert('profiles',{...p,id:data.user.id,role:'gestor'});return this.me()}
 async delNotifications(ids){if(!ids.length)return;const {data,error}=await this.c.from('notifications').delete().in('id',ids).select('id');if(error)throw this.err(error);if((data||[]).length<ids.length)throw new Error('Sem permissão para excluir notificações (falta rodar a migração no Supabase).')}
 async markRead(ids){if(!ids.length)return;const {error}=await this.c.from('notifications').update({read_at:nowISO()}).in('id',ids);if(error)throw this.err(error)}
 subscribeNotifs(uid,cb){this.unsubscribe();this.ch=this.c.channel('fc-notif-'+uid).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+uid},p=>cb(p.new)).subscribe()}
 unsubscribe(){if(this.ch){this.c.removeChannel(this.ch);this.ch=null}}
 async savePush(sub){const j=sub.toJSON();const row={endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_agent:navigator.userAgent.slice(0,200)};
  const {error}=await this.c.from('push_subscriptions').insert(row);if(error&&error.code!=='23505')throw this.err(error)}
 async analyzeEdge(prev,cur,ctx){const {data,error}=await this.c.functions.invoke('analyze-photos',{body:{prev,cur,angle:ctx.angle,label:ctx.label}});if(error)throw error;if(data&&data.error)throw new Error(data.error);return data} }

/* ======================= camada de dados: DEMO =======================
   Banco em memória que SIMULA as regras do Supabase: RLS por perfil, triggers de reserva/vistoria/avaria,
   notificações com deduplicação, sugestão de veículos e alertas periódicos (mesma lógica do schema.sql). */
const E=m=>new Error(m);
class DemoAPI{
 constructor(){this.t={profiles:[],vehicles:[],bookings:[],inspections:[],damages:[],refuels:[],maintenance:[],notifications:[],push_subscriptions:[],booking_events:[],maintenance_periods:[],companies:[],nosbeb_checklists:[],vehicle_drivers:[],fuel_requests:[],photo_feedback:[]};this.files={};this.pins={};this.cur=null;this.depth=0;this.listeners=[];this.sys=false}
 role(){return this.t.profiles.find(p=>p.id===this.cur&&p.active)?.role||''}
 isG(){return this.role()==='gestor'} isS(){return['gestor','recepcao'].includes(this.role())}
 visible(t,r){if(this.sys)return true;const u=this.cur,role=this.role();if(!role)return false;
  switch(t){case'profiles':return r.id===u||this.isS();case'vehicles':return this.isG();
   case'bookings':return this.isG()||r.driver_id===u||(role==='recepcao'&&(['aprovada','chave_retirada','em_uso','devolvido'].includes(r.status)||r.start_at>=new Date(Date.now()-2*864e5).toISOString()||(r.status==='solicitada'&&receptionEligible(r))));
   case'inspections':return this.isG()||r.driver_id===u||r.created_by===u;case'damages':return this.isG()||r.reported_by===u;
   case'refuels':return this.isG();case'maintenance':case'maintenance_periods':return this.isG();case'companies':return true;case'nosbeb_checklists':return this.isG()||r.inspected_by===u;case'vehicle_drivers':return this.isS()||r.driver_id===u;case'fuel_requests':case'photo_feedback':return this.isG();
   case'notifications':case'push_subscriptions':return r.user_id===u;
   case'booking_events':return this.isG()||this.t.bookings.some(b=>b.id===r.booking_id&&b.driver_id===u)}return true}
 async login(card,pin){const p=this.t.profiles.find(x=>x.card===normCard(card));if(!p||this.pins[p.id]!==pin)throw E('Cartão ou PIN inválido.');if(!p.active)throw E('Usuário desativado.');this.cur=p.id;return clone(p)}
 async me(){return this.cur?clone(this.t.profiles.find(x=>x.id===this.cur)):null}
 async logout(){this.cur=null;this.listeners=[]}
 async select(t,q={}){let r=this.t[t].filter(x=>this.visible(t,x));for(const [op,c,v] of (q.f||[]))r=r.filter(x=>op==='eq'?x[c]===v:op==='neq'?x[c]!==v:op==='gte'?x[c]!=null&&x[c]>=v:op==='lte'?x[c]!=null&&x[c]<=v:op==='lt'?x[c]!=null&&x[c]<v:op==='gt'?x[c]!=null&&x[c]>v:op==='in'?v.includes(x[c]):op==='is'?x[c]==v:true);
  if(q.order)r.sort((a,b)=>((a[q.order]??'')>(b[q.order]??'')?1:(a[q.order]??'')<(b[q.order]??'')?-1:0)*(q.desc?-1:1));if(q.limit)r=r.slice(0,q.limit);return clone(r)}
 canWrite(t,op,r){if(this.sys)return true;const role=this.role(),u=this.cur;if(!role&&!(t==='profiles'&&!this.t.profiles.length))return false;
  switch(t){case'vehicles':case'maintenance':case'maintenance_periods':case'companies':case'vehicle_drivers':case'fuel_requests':return this.isG();case'photo_feedback':return op==='I'?r.created_by===u:this.isG();case'refuels':return this.isG();case'nosbeb_checklists':return op==='I'?true:this.isG();case'profiles':return this.isG()||!this.t.profiles.length;
   case'bookings':return this.isS()||r.driver_id===u;case'inspections':return op==='I'?(this.isS()||r.driver_id===u):this.isG();
   case'damages':return op==='I'?r.reported_by===u:this.isG();case'notifications':return op==='U'&&r.user_id===u;case'push_subscriptions':return r.user_id===u;default:return false}}
 async insert(t,row){const D0={bookings:{status:'solicitada',flags:[],created_by:this.cur,passengers:1,vehicle_type_requested:'Indiferente',carries_cargo:false,sp_rodizio:false},inspections:{driver_id:this.cur,created_by:this.cur,photos:{},extras:[],checks:{},skipped_steps:[],complete:true},damages:{status:'pendente',source:'ia',reported_by:this.cur},refuels:{created_by:this.cur,level_after:1},maintenance:{created_by:this.cur,done_at:today()},vehicles:{company_id:null,rodizio_exempt:false,base_photos:{},base_photos_at:null,status:'disponivel',fuel_level:1,current_fuel:'gasolina',km_current:0,vehicle_type:'Hatch/compacto',seats:5,tire_pressure_interval_days:15,has_spare_tire:true,has_wheel_wrench:true,has_jack:true,has_triangle:true,has_spare_key:false,spare_key_holder:'Gestor de frota'},profiles:{active:true,role:'condutor'},push_subscriptions:{user_id:this.cur},maintenance_periods:{created_by:this.cur,started_at:nowISO()},companies:{fleet_controls:false},nosbeb_checklists:{inspected_by:this.cur,checks:{},photos:{}},photo_feedback:{created_by:this.cur,marks:[],features:[],boxes:[],metrics:{},missed:false,framing:false}};
  const n={id:uuid(),created_at:nowISO(),...(D0[t]||{}),...clone(row)};
  if(!this.canWrite(t,'I',n))throw E('Sem permissão para esta ação.');
  if(t==='vehicles'&&this.t.vehicles.some(x=>x.plate===n.plate))throw E('Registro duplicado (placa ou cartão já cadastrado).');
  if(t==='companies'&&this.t.companies.some(x=>x.name.toLowerCase()===String(n.name).toLowerCase()))throw E('Registro duplicado (placa ou cartão já cadastrado).');
  if(t==='bookings')this.bookingGuard('I',n,null);if(t==='inspections')this.inspectionBefore(n);if(t==='damages')this.damageBefore(n);if(t==='refuels')this.refuelBefore(n);if(t==='nosbeb_checklists')this.chkBefore(n);
  this.t[t].push(n);this.after(t,'I',n,null);return clone(n)}
 async update(t,id,patch){const i=this.t[t].findIndex(x=>x.id===id);if(i<0||!this.visible(t,this.t[t][i]))throw E('Registro não encontrado');const o=this.t[t][i];
  if(!this.canWrite(t,'U',o))throw E('Sem permissão para esta ação.');if(t==='notifications'&&Object.keys(patch).some(k=>k!=='read_at'))throw E('Sem permissão para esta ação.');
  const n={...o,...clone(patch)};if(t==='bookings')this.bookingGuard('U',n,o);if(t==='vehicles')this.vehicleBefore(n,o);
  this.t[t][i]=n;this.after(t,'U',n,o);return clone(n)}
 async sysUpdate(t,id,patch){this.depth++;try{const i=this.t[t].findIndex(x=>x.id===id);const o=this.t[t][i];const n={...o,...patch};if(t==='bookings')this.bookingGuard('U',n,o);this.t[t][i]=n;this.after(t,'U',n,o);return n}finally{this.depth--}}
 async del(t,id){if(!this.isG())throw E('Sem permissão');this.t[t]=this.t[t].filter(x=>x.id!==id)}
 async delInspections(ids){if(!this.isG())throw E('Sem permissão');this.t.inspections=this.t.inspections.filter(x=>!ids.includes(x.id));this.t.damages=this.t.damages.filter(x=>!ids.includes(x.inspection_id))}
 async delChecklists(ids){if(!this.isG())throw E('Sem permissão');this.t.nosbeb_checklists=this.t.nosbeb_checklists.filter(x=>!ids.includes(x.id));this.t.fuel_requests=(this.t.fuel_requests||[]).map(r=>ids.includes(r.checklist_id)?{...r,checklist_id:null}:r)}
 after(t,op,n,o){if(t==='nosbeb_checklists')this.chkAfter(n);if(t==='bookings')this.bookingAfter(op,n,o);if(t==='inspections')this.inspectionAfter(n);if(t==='damages')this.notifyRole('gestor','avaria','⚠ Possível avaria: '+this.vp(n.vehicle_id),`${angL(n.angle)} · ${n.description||''} · origem: ${n.source}`,'avarias',n.id,'alta');
  if(t==='refuels'){const v=this.V(n.vehicle_id);Object.assign(v,{fuel_level:n.level_after,current_fuel:n.fuel_type,km_current:Math.max(v.km_current,n.km||0),fuel_updated_at:n.created_at});
   this.t.fuel_requests.filter(f=>f.vehicle_id===n.vehicle_id&&f.status==='pendente').forEach(f=>Object.assign(f,{status:'atendida',resolved_at:nowISO(),refuel_id:n.id}))}
  if(t==='maintenance'){const v=this.V(n.vehicle_id),px={oleo:'oil',pneus:'tire',preventiva:'prev'}[n.kind];if(px){if(n.km!=null)v[px+'_last_km']=n.km;v[px+'_last_date']=n.done_at}if(['calibragem','pneus'].includes(n.kind))v.tire_pressure_last_date=n.done_at;v.km_current=Math.max(v.km_current,n.km||0)}
  if(t==='vehicles'&&op==='U')this.vehicleAfter(n,o)}
 isFleetV(id){const v=this.V(id);return fleetFlag(v,this.t.companies)}
 refuelBefore(n){if(this.isFleetV(n.vehicle_id)&&!(Number(n.liters)>0&&Number(n.cost)>0&&Number(n.km)>0))throw E('Abastecimento da frota NOSBEB exige litros, valor pago e quilometragem')}
 chkBefore(n){if(!this.isFleetV(n.vehicle_id))throw E('Checklist disponível apenas para veículos da frota NOSBEB');const v=this.V(n.vehicle_id),role=this.role();   // espelho de trg_nosbeb_chk_before()
  if(!this.sys&&this.cur&&n.inspected_by!==this.cur)throw E('Não é permitido registrar checklist em nome de outra pessoa');
  const prof=this.P(n.inspected_by);
  if(role==='condutor'&&!this.sys){if(prof.company_id!==v.company_id)throw E('Este veículo não pertence à sua empresa');}
  Object.assign(n,{driver_name:prof.name,driver_email:prof.email||null,company_id:v.company_id});const pre='nosbeb/'+n.vehicle_id+'/';
  for(const [k] of NITEMS){const it=(n.items||{})[k];if(!it||!['conforme','nao_conforme','na'].includes(it.status))throw E('Item sem avaliação: '+k);if(it.status==='na'&&!NA_OK.includes(k))throw E('Este item não admite "não se aplica": '+k);if((it.photos||[]).some(p=>!String(p).startsWith(pre)))throw E('Foto de item fora do caminho do veículo')}
  for(const k of ['frente','lat_esq','traseira','lat_dir'])if(!(n.photos||{})[k]||!String(n.photos[k]).startsWith(pre))throw E('Fotografe as 4 vistas externas do veículo (frente, lateral esquerda, traseira e lateral direita)');
  if(!n.water_photo||!n.oil_photo||!String(n.water_photo).startsWith(pre)||!String(n.oil_photo).startsWith(pre))throw E('Fotos da água e do óleo são obrigatórias');
  if(n.fuel_ok==null)throw E('Informe se o nível de combustível está adequado (mínimo 1/4)');

/* ======================= cálculos de negócio ======================= */
const kml=v=>Number(v.current_fuel==='alcool'?v.kml_alcool:v.kml_gasolina)||10;
// período REAL de uso (agenda e disponibilidade): devolução antecipada libera o veículo em returned_at
function realRange(b){const s=b.started_at||b.start_at;let e=b.returned_at||b.end_at;if(!b.returned_at&&['em_uso','chave_retirada'].includes(b.status))e=new Date(Math.max(+new Date(b.end_at),Date.now())).toISOString();return[s,e]}
function occupies(b,s,e){if(!ACTIVE.includes(b.status))return false;const bs=+new Date(b.started_at||b.start_at);let be=+new Date(b.end_at);if(b.status!=='aprovada')be=Math.max(be,Date.now()+15*6e4);return bs<e&&s<be}
function conflicts(vid,s,e,excl,list=D.bookings){return list.filter(b=>b.vehicle_id===vid&&b.id!==excl&&occupies(b,s,e))}
function inMaint(v,startISO){return v.status==='inativo'||(v.status==='manutencao'&&(!v.maintenance_expected_return||v.maintenance_expected_return>startISO))}
// sugestão de veículos (mesma regra de suggest_vehicles() no banco)
function suggestCompute(b,vehicles,bookings){const s=+new Date(b.start_at),e=+new Date(b.end_at),now=Date.now();
 return vehicles.filter(v=>v.status!=='inativo').map(v=>{const free=!conflicts(v.id,s,e,b.id,bookings).length,st_ok=!inMaint(v,b.start_at),type_ok=b.vehicle_type_requested==='Indiferente'||v.vehicle_type===b.vehicle_type_requested,seats_ok=Number(v.seats)>=Number(b.passengers||1);
  const toQ=Math.max(0,(Number(v.fuel_level)-.25))*Number(v.tank_liters||50)*kml(v),fuel_ok=toQ>=Number(b.est_km||0);
  const recent_km=bookings.filter(x=>x.vehicle_id===v.id&&x.returned_at&&now-new Date(x.returned_at)<30*864e5).reduce((a,x)=>a+Math.max(0,(x.km_end||0)-(x.km_start||0)),0);
  const cargo=b.carries_cargo&&['Picape/caminhonete (caçamba)','Utilitário/van'].includes(v.vehicle_type)?50:0;
  const rod=b.sp_rodizio?rodizioCheck(v.plate,b.start_at,b.end_at,v.rodizio_exempt):null,rr=!!rod?.restricted;
  const reasons=[!free&&'ocupado no período',!st_ok&&'em manutenção',!type_ok&&'tipo diferente do pedido',!seats_ok&&'lotação insuficiente',!fuel_ok&&'abastecer antes',rr&&`rodízio SP (final ${rod.digit})`].filter(Boolean);
  return{vehicle_id:v.id,plate:v.plate,model:v.model,vehicle_type:v.vehicle_type,seats:v.seats,available:free&&st_ok,type_ok,seats_ok,fuel_ok,recent_km,score:(free&&st_ok)*1000+type_ok*300+seats_ok*200+fuel_ok*100+cargo-(rr?400:0)-recent_km/100,reasons,rodizio_restricted:rr,rodizio_note:rod?rodNote(rod):null}}).sort((a,b)=>b.score-a.score)}
function fuelInfo(v){
 const tank=Number(v.tank_liters)||50,k=kml(v),lvl=Number(v.fuel_level);
 const autonomy=Math.round(lvl*tank*k),toQ=Math.max(0,Math.round((lvl-.25)*tank*k)),toFill=Math.round((1-lvl)*tank);
 const up=D.bookings.filter(b=>b.vehicle_id===v.id&&ACTIVE.includes(b.status)&&new Date(b.end_at)>Date.now()).sort((a,b)=>a.start_at.localeCompare(b.start_at));
 let cum=0,crit=null,unknown=0;for(const b of up){if(!b.est_km){unknown++;continue}cum+=Number(b.est_km);if(!crit&&cum>=toQ)crit=b}
 let st='ok',msg=`~${toQ} km até 1/4`;
 if(lvl<=.25){st='bad';msg=`tanque em ${fuelL(lvl)}: abastecer agora (faltam ~${toFill} L para encher)`}
 else if(crit){st='warn';msg=`abastecer antes da reserva de ${pName(crit.driver_id)} em ${fmtDT(crit.start_at)}: as reservas somam ~${cum} km e restam ~${toQ} km até 1/4`}
 else if(toQ<CONFIG.FUEL_ALERT_KM){st='warn';msg=`faltam só ~${toQ} km para chegar a 1/4: programe o abastecimento`}
 return{tank,k,lvl,autonomy,toQ,toFill,st,msg,up,cum,unknown}}
function maintStatus(v,px){
 const ik=v[px+'_interval_km'],im=v[px+'_interval_months'],lk=v[px+'_last_km'],ld=v[px+'_last_date'];
 if(!ik&&!im)return{st:'na',txt:'periodicidade não informada'};
 if(lk==null&&!ld)return{st:'warn',txt:'sem registro da última troca'};
 const nextKm=ik&&lk!=null?Number(lk)+Number(ik):null,nextDate=im&&ld?addMonths(ld,im):null;
 const kmLeft=nextKm!=null?nextKm-v.km_current:null,dLeft=nextDate?daysTo(nextDate):null;
 let st='ok';if((kmLeft!=null&&kmLeft<=0)||(dLeft!=null&&dLeft<=0))st='bad';else if((kmLeft!=null&&kmLeft<=Math.max(500,ik*.1))||(dLeft!=null&&dLeft<=30))st='warn';
 const parts=[];if(nextKm!=null)parts.push(kmLeft<=0?`vencida por KM (${fmtKm(nextKm)})`:`em ${fmtKm(kmLeft)} (aos ${fmtKm(nextKm)})`);
 if(nextDate)parts.push(dLeft<=0?`vencida por data (${fmtD(nextDate)})`:`ou até ${fmtD(nextDate)}`);
 return{st,txt:(st==='bad'?'':'próxima ')+parts.join(' ')}}
// calibragem de pneus: periodicidade em dias
function tpStatus(v){const iv=v.tire_pressure_interval_days;if(!iv)return{st:'na',txt:'periodicidade não informada'};if(!v.tire_pressure_last_date)return{st:'warn',txt:'sem registro de calibragem'};
 const next=addDays(v.tire_pressure_last_date,iv),d=daysTo(next);const psi=v.tire_pressure_psi_front?` · ${v.tire_pressure_psi_front}/${v.tire_pressure_psi_rear||v.tire_pressure_psi_front} psi`:'';
 return{st:d<=0?'bad':d<=2?'warn':'ok',txt:(d<=0?`vencida desde ${fmtD(next)}`:`próxima até ${fmtD(next)}`)+psi}}
const SAFETY=[['has_spare_tire','Estepe'],['has_wheel_wrench','Chave de roda'],['has_jack','Macaco'],['has_triangle','Triângulo']];
const missingSafety=v=>SAFETY.filter(([k])=>v[k]===false).map(s=>s[1]);
const stBadge=(st,txt)=>`<span class="badge ${st==='bad'?'b-bad':st==='warn'?'b-warn':st==='na'?'b-mut':'b-ok'}">${txt}</span>`;
const stShort=m=>stBadge(m.st,m.st==='ok'?'OK':m.st==='na'?'-':m.st==='bad'?'Vencida':'Próxima');
function vehNow(v){const now=Date.now();if(v.status==='manutencao')return[`Em manutenção${v.maintenance_expected_return?' · retorno '+fmtDT(v.maintenance_expected_return)+(new Date(v.maintenance_expected_return)<now?' (atrasado)':''):''}`,v.maintenance_expected_return&&new Date(v.maintenance_expected_return)<now?'b-bad':'b-mut'];if(v.status==='inativo')return['Inativo','b-mut'];
 if(isFleetV(v))return['Frota NOSBEB · uso individual','b-info'];   // não é reservado: ferramenta de trabalho de motorista específico
 const cur=D.bookings.find(b=>b.vehicle_id===v.id&&['chave_retirada','em_uso'].includes(b.status));if(cur)return[`Em uso · ${pName(cur.driver_id)} até ${fmtT(cur.end_at)}`,new Date(cur.end_at)<now?'b-bad':'b-warn'];
 const dv=D.bookings.find(b=>b.vehicle_id===v.id&&b.status==='devolvido');if(dv)return['No pátio · chave pendente','b-info'];
 const nx=D.bookings.find(b=>b.vehicle_id===v.id&&b.status==='aprovada'&&new Date(b.end_at)>now);if(nx&&new Date(nx.start_at)-now<3*36e5)return[`Disponível · reservado às ${fmtT(nx.start_at)}`,'b-info'];
 return['Disponível','b-ok']}

VIEWS.solicitar=()=>{if(!AG)agInit();const ed=!!AG.id;AFTER.push(agUpd);
 return`<h2>${ed?'Editar reserva':'Solicitar veículo'}</h2>
 ${!ed&&!isS()?'<div class="infobox" style="margin:0 0 12px">Descreva a necessidade. O gestor de frota escolhe o veículo conforme a disponibilidade e você recebe uma notificação com a aprovação.</div>':''}
 ${ed&&AG.orig.status==='aprovada'&&AG.orig.driver_id===ME.id?'<div class="warnbox" style="margin:0 0 12px">Mudar <b>período, passageiros, tipo de veículo ou carga</b> envia a reserva para nova aprovação e libera o veículo. Destino, finalidade e observações mantêm a aprovação.</div>':''}
 <div class="card"><div class="f2">
 <div><label>Saída prevista (estimativa) *</label><input type="datetime-local" value="${AG.start}" oninput="AG.start=this.value;agUpd()"></div>
 <div><label>Retorno *</label><div class="seg"><button class="${AG.mode==='dur'?'on':''}" onclick="AG.mode='dur';render()">Duração</button><button class="${AG.mode==='ret'?'on':''}" onclick="AG.mode='ret';render()">Data/hora de retorno</button></div>
  ${AG.mode==='dur'?`<div class="row" style="margin-top:6px;flex-wrap:nowrap"><input type="number" min="0.5" step="0.5" inputmode="decimal" value="${AG.dur}" oninput="AG.dur=Number(this.value.replace(',','.'));agUpd()" style="width:90px"><span class="mut">horas</span>${[2,4,8].map(h=>`<button class="btn sm" onclick="AG.dur=${h};render()">${h}h</button>`).join('')}</div>`:`<input type="datetime-local" style="margin-top:6px" value="${AG.ret}" oninput="AG.ret=this.value;agUpd()">`}</div>
 <div style="grid-column:1/-1"><label>Destino *</label><input value="${esc(AG.dest)}" placeholder="Cidade, cliente ou endereço" oninput="AG.dest=this.value"></div>
 <div style="grid-column:1/-1"><label>Finalidade *</label><input value="${esc(AG.purpose)}" placeholder="Visita a cliente, entrega, reunião..." oninput="AG.purpose=this.value"></div>
 <div><label>Nº de pessoas a transportar *</label><input type="number" min="1" inputmode="numeric" value="${esc(AG.passengers)}" oninput="AG.passengers=this.value;agUpd()"></div>
 <div><label>Tipo de veículo desejado *</label><select onchange="AG.vtype=this.value;agUpd()">${CONFIG.VEHICLE_TYPES.map(t=>`<option ${AG.vtype===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
 <div><label>Distância estimada ida e volta (km)</label><input type="number" inputmode="numeric" value="${esc(AG.est_km)}" placeholder="opcional" oninput="AG.est_km=this.value;agUpd()"></div>
 <div><label>Transporta carga?</label><div class="seg"><button class="${!AG.cargo?'on':''}" onclick="AG.cargo=false;render()">Não</button><button class="${AG.cargo?'on':''}" onclick="AG.cargo=true;render()">Sim</button></div></div>
 <div><label>A rota passa pelo rodízio de São Paulo?</label><div class="seg"><button class="${!AG.sp?'on':''}" onclick="AG.sp=false;render()">Não</button><button class="${AG.sp?'on':''}" onclick="AG.sp=true;render()">Sim</button></div></div>
 <div id="agRoute" style="grid-column:1/-1"></div>
 ${AG.cargo?`<div style="grid-column:1/-1"><label>Descrição da carga</label><input value="${esc(AG.cargo_desc)}" placeholder="Ex.: item grande na caçamba" oninput="AG.cargo_desc=this.value"></div>`:''}
 <div style="grid-column:1/-1"><label>Observações</label><textarea oninput="AG.notes=this.value">${esc(AG.notes)}</textarea></div>
 </div><div id="agEnd" class="small mut" style="margin-top:8px"></div></div>
 ${isS()&&!ed?`<div class="card"><label class="ck"><input type="checkbox" ${AG.direct?'checked':''} onchange="AG.direct=this.checked;render()"> Reserva direta (já aprovada, com veículo) em nome de um condutor</label>
  ${AG.direct?`<label>Condutor</label><select onchange="AG.driver=this.value;agUpd()">${D.profiles.filter(p=>p.active).map(p=>`<option value="${p.id}" ${AG.driver===p.id?'selected':''}>${esc(p.name)} (${esc(p.card)})</option>`).join('')}</select><h3 style="margin-top:12px">Veículo</h3><div id="agList"></div>`:''}</div>`:''}
 <button class="btn pri big" onclick="agSave()">${ed?'Salvar alterações':AG.direct?'Confirmar reserva aprovada':'Enviar solicitação ao gestor'}</button>
 ${ed?`<div class="row" style="margin-top:8px"><button class="btn" onclick="AG=null;go('minhas')">Cancelar edição</button></div>`:''}`};
function agUpd(){const [s,e]=agRange(),el=$('#agEnd');if(!el)return;el.textContent=isNaN(s)||isNaN(e)?'':`Retorno previsto: ${fmtDT(new Date(e))} (${fmtDur((e-s)/36e5)})`;const L=$('#agList');if(L)L.innerHTML=agList();const R=$('#agRoute');if(R)R.innerHTML=agRoute()}
function agRoute(){const km=AG.est_km===''?null:Number(AG.est_km),h=[];
 if(km!=null&&km>0&&km<100)h.push('<div class="okbox">Programação inferior a 100 km: a solicitação será <b>recebida e aprovada pela recepção</b> (o gestor de frota também é avisado).</div>');
 else if(km!=null&&km>=100)h.push('<div class="infobox">Com 100 km ou mais, a solicitação segue para a aprovação do <b>gestor de frota</b>.</div>');
 else h.push('<div class="infobox">Informe a distância programada: abaixo de 100 km a recepção aprova; sem distância ou com 100 km ou mais, decide o gestor de frota.</div>');
 if(AG.sp)h.push('<div class="infobox">Rodízio de SP (seg–sex, 7h–10h e 17h–20h, conforme o final da placa): na aprovação será escolhido, sempre que possível, um veículo sem restrição no período.</div>');return h.join('')}
function agList(){const [s,e]=agRange();if(isNaN(s)||isNaN(e)||e<=s)return'<p class="mut">Informe saída e retorno.</p>';
 const fake={id:'_',start_at:new Date(s).toISOString(),end_at:new Date(e).toISOString(),passengers:Number(AG.passengers)||1,vehicle_type_requested:AG.vtype,est_km:Number(AG.est_km)||0,carries_cargo:AG.cargo,sp_rodizio:AG.sp};
 return suggestCompute(fake,D.vehicles,D.bookings).map(r=>{const v=V(r.vehicle_id);if(!r.available&&AG.vehicle===v.id)AG.vehicle='';
  return`<div class="vopt ${r.available?'':'dis'} ${AG.vehicle===v.id?'sel':''}" onclick="${r.available?`AG.vehicle='${v.id}';agUpd()`:''}"><div class="row sp"><b>${AG.vehicle===v.id?'✅ ':''}${esc(v.plate)} · ${esc(v.model)}</b>${r.available?'<span class="badge b-ok">Disponível</span>':'<span class="badge b-mut">Indisponível</span>'}</div>
  <div class="small mut">${esc(v.vehicle_type)} · ${v.seats} lugares · ${gauge(Number(v.fuel_level))}${r.reasons.length?' · '+r.reasons.join(', '):''}${AG.sp&&!r.rodizio_restricted?' · ✅ rodízio SP':''}</div></div>`}).join('')}
async function agSave(){const [s,e]=agRange();
 if(isNaN(s))return toast('Informe a saída prevista');if(isNaN(e)||e<=s)return toast('O retorno deve ser depois da saída');if(!AG.id&&s<Date.now()-30*6e4)return toast('A saída prevista já passou');
 if(!AG.dest.trim())return toast('Informe o destino');if(!AG.purpose.trim())return toast('Informe a finalidade');if(!(Number(AG.passengers)>=1))return toast('Informe o nº de pessoas (mínimo 1)');
 const row={start_at:new Date(s).toISOString(),end_at:new Date(e).toISOString(),destination:AG.dest.trim(),purpose:AG.purpose.trim(),passengers:Number(AG.passengers),vehicle_type_requested:AG.vtype,est_km:AG.est_km!==''?Number(AG.est_km):null,carries_cargo:AG.cargo,cargo_description:AG.cargo?AG.cargo_desc.trim()||null:null,notes:AG.notes.trim()||null,sp_rodizio:AG.sp};
 busy(true,'Enviando...');try{
  if(AG.id){const o=AG.orig;const core=['start_at','end_at','passengers','vehicle_type_requested','carries_cargo','cargo_description'].some(k=>(row[k]??null)!==(o[k]??null))||row.sp_rodizio!==!!o.sp_rodizio||receptionEligible(row)!==receptionEligible(o);
   if(o.status==='aprovada'&&o.driver_id===ME.id&&core&&!confirm('Essa alteração envia a reserva para nova aprovação e libera o veículo atribuído. Continuar?')){busy(false);return}
   const r=await api.update('bookings',AG.id,row);toast(r&&r.status==='solicitada'&&o.status==='aprovada'?'Alteração enviada: aguardando nova aprovação do gestor':'Reserva atualizada')}
  else if(AG.direct){if(!AG.vehicle)throw new Error('Escolha um veículo disponível');const d=P(AG.driver);if(d?.cnh_validade&&d.cnh_validade<localDate(new Date(e)))throw new Error('CNH do condutor vencida ou vence antes do fim da reserva');
   await api.insert('bookings',{...row,driver_id:AG.driver,vehicle_id:AG.vehicle,status:'aprovada'});toast('Reserva aprovada criada')}
  else{await api.insert('bookings',{...row,driver_id:ME.id});toast('Solicitação enviada! Você será notificado quando o gestor decidir.',5000)}
  const wasDirect=AG.direct;AG=null;await loadData();go(wasDirect?'agenda':'minhas')}catch(err){toast(err.message,6000)}finally{busy(false)}}

/* ======================= MINHAS RESERVAS ======================= */
VIEWS.minhas=()=>{const my=D.bookings.filter(b=>b.driver_id===ME.id).sort((a,b)=>b.start_at.localeCompare(a.start_at));
 const up=my.filter(b=>!FINAL.includes(b.status)).reverse(),past=my.filter(b=>FINAL.includes(b.status));
 return`<div class="row sp"><h2>Minhas reservas</h2><button class="btn pri" onclick="AG=null;go('solicitar')">+ Solicitar</button></div>
 <h3>Ativas, pendentes e futuras</h3>${up.map(b=>bCard(b)).join('')||'<p class="mut small">Nenhuma.</p>'}<h3 style="margin-top:16px">Encerradas (45 dias)</h3>${past.map(b=>bCard(b)).join('')||'<p class="mut small">Nenhuma.</p>'}`};

/* ======================= SOLICITAÇÕES (gestor) ======================= */
VIEWS.solicitacoes=()=>{const L=D.bookings.filter(b=>b.status==='solicitada'&&(isG()||receptionEligible(b))).sort((a,b)=>a.start_at.localeCompare(b.start_at));
 const recent=D.bookings.filter(b=>b.approved_at&&Date.now()-new Date(b.approved_at)<2*864e5).sort((a,b)=>b.approved_at.localeCompare(a.approved_at)).slice(0,8);
 return`<h2>${isG()?'Solicitações pendentes':'Aprovações'} (${L.length})</h2>${isG()?'':'<div class="infobox" style="margin:0 0 12px">A recepção recebe e aprova as viagens com <b>programação inferior a 100 km</b>. As demais solicitações são decididas pelo gestor de frota, que também é avisado das aprovações feitas aqui.</div>'}${L.map(b=>`<div class="card"><div class="row sp"><div><b>${esc(pName(b.driver_id))}</b> ${bBadge(b)}<br><span class="small">${fmtDT(b.start_at)} → ${fmtDT(b.end_at)} · 📍 ${esc(b.destination)} · ${esc(b.purpose||'')}</span><br><span class="small mut">${reqLine(b)}${b.notes?' · '+esc(b.notes):''}</span>
  ${b.adjust_requested_at?`<div class="warnbox">Ajuste pedido em ${fmtDT(b.adjust_requested_at)}: ${esc(b.manager_comment||'')}</div>`:''}</div><button class="btn pri" onclick="openDecision('${b.id}')">Analisar e decidir</button></div></div>`).join('')||'<div class="card mut">Nenhuma solicitação pendente. 🎉</div>'}
 ${recent.length?`<h3>Aprovadas recentemente</h3>${recent.map(b=>bCard(b)).join('')}`:''}`};
let DEC=null;
async function openDecision(id){const b=D.bookings.find(x=>x.id===id);busy(true,'Calculando sugestões...');let sug=[];
 try{sug=await api.rpc('suggest_vehicles',{p_booking:id})}catch(e){sug=suggestCompute(b,D.vehicles,D.bookings)}finally{busy(false)}
 DEC={id,sug,vehicle:sug.find(s=>s.available&&!s.rodizio_restricted)?.vehicle_id||sug.find(s=>s.available)?.vehicle_id||'',start:localInput(b.start_at),end:localInput(b.end_at)};
 openModal(`<div class="row sp"><h3>Solicitação de ${esc(pName(b.driver_id))}</h3><button class="btn sm" onclick="closeModal()">✕</button></div>
 <p class="small">📍 ${esc(b.destination)} · ${esc(b.purpose||'')}<br>${reqLine(b)}${b.notes?'<br>Obs.: '+esc(b.notes):''}</p>
 ${!isG()?'<div class="infobox">Programação inferior a 100 km: a recepção pode aprovar ou recusar. O gestor de frota é avisado da sua decisão.</div>':''}${b.sp_rodizio?'<div class="warnbox">A rota passa pelo rodízio de São Paulo (seg–sex, 7h–10h e 17h–20h, por final de placa). Os veículos com restrição no período aparecem marcados com 🚫; feriados e suspensões não são considerados.</div>':''}
 <div class="f2"><div><label>Saída</label><input type="datetime-local" value="${DEC.start}" oninput="DEC.start=this.value"></div><div><label>Retorno</label><input type="datetime-local" value="${DEC.end}" oninput="DEC.end=this.value"></div></div>
 <h3 style="margin-top:12px">Veículos sugeridos</h3><p class="small mut">Ordem: disponível no período, tipo, lotação, combustível para a distância e menor uso recente.</p>
 ${sug.map((s,i)=>{const v=V(s.vehicle_id);return`<div class="vopt ${s.available?'':'dis'} ${DEC.vehicle===s.vehicle_id?'sel':''}" id="dv_${s.vehicle_id}" onclick="decPick('${s.vehicle_id}')"><div class="row sp"><b>${i===0&&s.available?'⭐ ':''}${esc(s.plate)} · ${esc(s.model)}</b>${s.available?'<span class="badge b-ok">Disponível</span>':'<span class="badge b-mut">Indisponível</span>'}</div>
  <div class="small mut">${esc(s.vehicle_type)} · ${s.seats} lugares${v?' · '+gauge(Number(v.fuel_level)):''} · ${s.recent_km} km nos últimos 30 dias</div>
  <div class="small">${[s.type_ok?'✅ tipo':'⚠ tipo',s.seats_ok?'✅ lotação':'⚠ lotação',s.fuel_ok?'✅ combustível':'⛽ abastecer antes',...(b.sp_rodizio?[s.rodizio_restricted?'🚫 rodízio SP':'✅ rodízio SP']:[])].join(' · ')}${s.rodizio_note&&b.sp_rodizio?` · <span class="small mut">${esc(s.rodizio_note)}</span>`:''}${s.reasons.length?' · <span style="color:var(--bad)">'+esc(s.reasons.join(', '))+'</span>':''}</div></div>`}).join('')}
 <label>Comentário ao solicitante (obrigatório para recusar ou pedir ajuste)</label><textarea id="decC"></textarea>
 <div class="row" style="margin-top:12px"><button class="btn okb" onclick="decApprove()">✔ Aprovar com o veículo selecionado</button>${isG()?'<button class="btn" onclick="decAdjust()">Pedir ajuste</button>':''}<button class="btn bad" onclick="decReject()">Recusar</button></div>`)}
function decPick(vid){DEC.vehicle=vid;document.querySelectorAll('#modal .vopt').forEach(x=>x.classList.toggle('sel',x.id==='dv_'+vid))}
async function decApprove(){if(!DEC.vehicle)return toast('Selecione um veículo');const s=new Date(DEC.start),e=new Date(DEC.end);if(!(e>s))return toast('Retorno deve ser após a saída');
 const bk=D.bookings.find(x=>x.id===DEC.id),vv=V(DEC.vehicle);if(bk?.sp_rodizio&&vv){const rr=rodizioCheck(vv.plate,s.toISOString(),e.toISOString(),vv.rodizio_exempt);if(rr.restricted&&!confirm(`O veículo ${vv.plate} (final ${rr.digit}) tem restrição de rodízio no período (${rodNote(rr).replace('restrito: ','')}). Aprovar mesmo assim?`))return}
 const c=$('#decC').value.trim();busy(true,'Aprovando...');try{await api.update('bookings',DEC.id,{status:'aprovada',vehicle_id:DEC.vehicle,start_at:s.toISOString(),end_at:e.toISOString(),manager_comment:c||null});closeModal();toast('Reserva aprovada: o condutor foi notificado');await refresh()}catch(err){toast(err.message,6000)}finally{busy(false)}}
async function decReject(){const c=$('#decC').value.trim();if(!c)return toast('Informe o motivo da recusa no comentário');busy(true);try{await api.update('bookings',DEC.id,{status:'recusada',rejected_reason:c});closeModal();toast('Solicitação recusada');await refresh()}catch(e){toast(e.message)}finally{busy(false)}}
async function decAdjust(){const c=$('#decC').value.trim();if(!c)return toast('Escreva o ajuste que você precisa no comentário');busy(true);try{await api.update('bookings',DEC.id,{manager_comment:c,adjust_requested_at:nowISO()});closeModal();toast('Pedido de ajuste enviado ao solicitante');await refresh()}catch(e){toast(e.message)}finally{busy(false)}}
function editBookingG(id){const b=D.bookings.find(x=>x.id===id);closeModal();
 openForm('Editar reserva (gestor)',[{n:'driver_id',l:'Condutor',t:'select',o:D.profiles.filter(p=>p.active).map(p=>[p.id,p.name]),full:1},{n:'vehicle_id',l:'Veículo',t:'select',o:[['','— a definir —'],...D.vehicles.map(v=>[v.id,`${v.plate} · ${v.model} (${v.vehicle_type}, ${v.seats} lug.)`])],full:1},
  {n:'start_at',l:'Saída prevista',t:'datetime-local',req:1},{n:'end_at',l:'Retorno previsto',t:'datetime-local',req:1},{n:'destination',l:'Destino',req:1},{n:'purpose',l:'Finalidade'},{n:'passengers',l:'Pessoas',t:'number'},{n:'vehicle_type_requested',l:'Tipo desejado',t:'select',o:CONFIG.VEHICLE_TYPES.map(t=>[t,t])},{n:'est_km',l:'Distância estimada (km)',t:'number'},{n:'sp_rodizio',l:'Rodízio SP',cl:'A rota passa pelo rodízio de São Paulo',t:'check'},{n:'notes',l:'Observações',t:'textarea',full:1}],
  b,o=>{if(new Date(o.end_at)<=new Date(o.start_at))throw new Error('Retorno deve ser após a saída');if(b.status!=='solicitada'&&!o.vehicle_id)throw new Error('Reserva aprovada precisa de veículo');return api.update('bookings',id,o)})}

/* ======================= CHAVES (recepção) ======================= */
VIEWS.chaves=()=>{const t=today(),now=Date.now(),B=D.bookings;
 const wait=B.filter(b=>b.status==='aprovada'&&localDate(b.start_at)<=t).sort((a,b)=>a.start_at.localeCompare(b.start_at));
 const out=B.filter(b=>['chave_retirada','em_uso'].includes(b.status)),back=B.filter(b=>b.status==='devolvido');
 const done=B.filter(b=>b.status==='concluido'&&b.key_in_at&&localDate(b.key_in_at)===t);
 const row=(b,act)=>{const v=V(b.vehicle_id),d=P(b.driver_id);let fl='';
  if(b.status==='chave_retirada'&&now-new Date(b.key_out_at)>15*6e4)fl=`<div class="badbox">Chave entregue às ${fmtT(b.key_out_at)} e a vistoria de retirada ainda não foi feita.</div>`;
  if(b.status==='em_uso'&&new Date(b.end_at)<now)fl=`<div class="badbox">Devolução prevista para ${fmtDT(b.end_at)}: atrasado.</div>`;
  if((b.flags||[]).includes('vistoria_incompleta'))fl+=`<div class="warnbox">Vistoria incompleta (termo aceito pelo condutor).</div>`;
  return`<div class="card"><div class="row sp"><div><b>${esc(v?.plate||'')}</b> · ${esc(v?.model||'')} ${bBadge(b)}<br><span class="small">${fmtDT(b.start_at)}–${fmtT(b.end_at)} (previsto) · <b>${esc(d?.name||'')}</b> (cartão ${esc(d?.card||'')}) · 📍 ${esc(b.destination)}</span></div><div class="row">${act}</div></div>${fl}</div>`};
 return`<div class="row sp"><h2>Chaves · hoje</h2><button class="btn sm" onclick="refresh()">↻ Atualizar</button></div>
 <p class="small mut">O horário das reservas é estimativa: a chave pode ser retirada a qualquer hora do dia da reserva. A chave reserva fica com o gestor de frota, não na recepção.</p>
 ${ME.role==='recepcao'&&pendRecv()?`<div class="warnbox" style="cursor:pointer;margin:0 0 12px" onclick="go('solicitacoes')"><b>📥 ${pendRecv()} aprovação(ões) pendente(s): viagens com menos de 100 km</b> · toque para analisar</div>`:''}
 <h3>Aguardando retirada (${wait.length})</h3>${wait.map(b=>row(b,`<button class="btn pri sm" onclick="keyOut('${b.id}')">🔑 Entregar chave</button>${now>+new Date(b.end_at)?`<button class="btn sm" onclick="noShow('${b.id}')">Não compareceu</button>`:''}`)).join('')||'<p class="mut small">Nenhuma.</p>'}
 <h3>Chave com o condutor (${out.length})</h3>${out.map(b=>row(b,`${P(b.driver_id)?.phone?`<a class="btn sm" href="tel:${esc(P(b.driver_id).phone)}">📞</a>`:''}<button class="btn sm" onclick="keyIn('${b.id}')">Receber chave</button>`)).join('')||'<p class="mut small">Nenhuma.</p>'}
 <h3>Devolvidos, chave pendente (${back.length})</h3>${back.map(b=>row(b,`<button class="btn okb sm" onclick="keyIn('${b.id}')">✔ Receber chave</button>`)).join('')||'<p class="mut small">Nenhum.</p>'}
 <h3>Concluídos hoje (${done.length})</h3>${done.map(b=>row(b,'')).join('')||'<p class="mut small">Nenhum.</p>'}`};
function keyOut(id){const b=D.bookings.find(x=>x.id===id),d=P(b.driver_id),v=V(b.vehicle_id),cnh=daysTo(d?.cnh_validade);
 openModal(`<h3>Entregar chave</h3><p><b>${esc(v?.plate)}</b> · ${esc(v?.model)}<br>Condutor: <b>${esc(d?.name)}</b> · cartão <b>${esc(d?.card)}</b></p>
 <p class="small">CNH: ${d?.cnh_validade?fmtD(d.cnh_validade):'não informada'} ${cnh!==null&&cnh<0?'<span class="badge b-bad">VENCIDA</span>':''}<br>Reserva: ${fmtDT(b.start_at)}–${fmtT(b.end_at)} (previsto) · ${esc(b.destination)}<br>Combustível registrado: ${gauge(Number(v?.fuel_level))}</p>
 <div class="infobox">Confira o cartão do condutor e lembre-o de fazer a <b>vistoria de retirada com fotos no app</b> antes de sair.</div>
 <div class="row" style="margin-top:12px"><button class="btn pri" ${cnh!==null&&cnh<0?'disabled':''} onclick="keyOutOk('${id}')">Confirmar entrega</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`)}
async function keyOutOk(id){busy(true);try{await api.update('bookings',id,{status:'chave_retirada',key_out_at:nowISO(),key_out_by:ME.id});closeModal();toast('Entrega da chave registrada');await refresh()}catch(e){toast(e.message)}finally{busy(false)}}
let RT_REC=null;
function keyIn(id){const b=D.bookings.find(x=>x.id===id),v=V(b.vehicle_id);if(b.status==='devolvido')return keyInOk(id);RT_REC={id,fuel:null};
 openModal(`<h3>Receber chave: ${esc(v?.plate)}</h3><div class="warnbox">${esc(pName(b.driver_id))} não registrou a vistoria de devolução no app. Registre KM e combustível pelo painel do veículo. A devolução ficará marcada como <b>sem registro fotográfico</b>.</div>

function consumption(v,kmS,fS,kmE,fE){if(kmS==null||fS==null||!v)return null;const km=kmE-kmS,tank=Number(v.tank_liters)||50,exp=km/kml(v),obs=(fS-fE)*tank;
 return{km,expected_l:Math.round(exp*10)/10,observed_l:Math.round(obs*10)/10,flag:obs-exp>tank*.25+2}}

function ganttHTML(day,vs){const d0=new Date(day+'T06:00:00'),d1=new Date(day+'T23:00:00'),span=d1-d0,LH=34;
 const col={aprovada:'#2563eb',chave_retirada:'#d97706',em_uso:'#d97706',devolvido:'#0891b2',concluido:'#16a34a',nao_compareceu:'#94a3b8'};
 const pct=t=>Math.max(0,Math.min(100,(new Date(t)-d0)/span*100)),nowP=(Date.now()-d0)/span*100;
 const list=D.bookings.filter(b=>b.vehicle_id&&!['cancelada','recusada'].includes(b.status)&&new Date(b.start_at)<d1&&new Date(realRange(b)[1])>d0);
 return`<div class="tlh">${[6,8,10,12,14,16,18,20,22].map(h=>`<span>${h}h</span>`).join('')}</div>`+vs.map(v=>{
  const ms=v.status==='manutencao'?pct(v.maintenance_since||d0):null,me=v.status==='manutencao'?(v.maintenance_expected_return?pct(v.maintenance_expected_return):100):null;
  // cada reserva ocupa o intervalo que inclui o contorno previsto e a barra real; reservas que se tocam vão para faixas diferentes
  const its=list.filter(b=>b.vehicle_id===v.id).map(b=>{const [rs,re]=realRange(b),planned=['aprovada','nao_compareceu'].includes(b.status),bs=planned?pct(b.start_at):pct(rs),be=planned?pct(b.end_at):pct(re);
   return{b,rs,re,planned,bs,be,a:Math.min(pct(b.start_at),bs),z:Math.max(pct(b.end_at),be)}}).sort((x,y)=>x.a-y.a||x.z-y.z);
  const ends=[];its.forEach(it=>{let l=ends.findIndex(e=>e<=it.a+.01);if(l<0){l=ends.length;ends.push(0)}ends[l]=it.z;it.lane=l});
  const H=Math.max(1,ends.length)*LH;
  return`<div class="tlr"><div class="lb" title="${esc(v.model)}"><b>${esc(v.plate)}</b><br><span class="mut">${esc(v.model)}</span></div><div class="tl" style="height:${H}px">
  ${ms!=null&&me>ms?`<div class="mnt" style="left:${ms}%;width:${me-ms}%">🔧 manutenção${v.maintenance_expected_return?' até '+fmtDT(v.maintenance_expected_return):''}</div>`:''}
  ${its.map(({b,rs,re,planned,lane})=>{const late=b.status==='em_uso'&&new Date(b.end_at)<Date.now(),top=lane*LH;
   return`<div class="plan" style="left:${pct(b.start_at)}%;width:${pct(b.end_at)-pct(b.start_at)}%;top:${top+2}px;height:${LH-4}px;bottom:auto" title="Previsto ${fmtT(b.start_at)}–${fmtT(b.end_at)}"></div>`
   +(planned?`<div class="bar" onclick="openBooking('${b.id}')" style="left:${pct(b.start_at)}%;width:${pct(b.end_at)-pct(b.start_at)}%;top:${top+6}px;height:${LH-12}px;bottom:auto;background:${col[b.status]};opacity:.55" title="${esc(pName(b.driver_id))} (previsto)">${esc(pName(b.driver_id).split(' ')[0])}</div>`
    :`<div class="bar" onclick="openBooking('${b.id}')" style="left:${pct(rs)}%;width:${pct(re)-pct(rs)}%;top:${top+6}px;height:${LH-12}px;bottom:auto;background:${late?'#dc2626':col[b.status]}" title="${esc(pName(b.driver_id))} · real ${fmtT(rs)}–${b.returned_at?fmtT(re):'agora'}">${esc(pName(b.driver_id).split(' ')[0])}</div>`)}).join('')}
  ${nowP>0&&nowP<100?`<div class="now" style="left:${nowP}%"></div>`:''}</div></div>`}).join('')
  +`<div class="small mut" style="margin-top:6px">Contorno tracejado = período previsto · barra sólida = uso real (de retirada até devolução) · 🟦 aprovada · 🟧 em uso · 🟩 concluída · 🟥 atrasado · hachurado = manutenção · reservas que se sobrepõem aparecem em linhas separadas</div>`}

/* ======================= visão computacional local (v4) =======================
   Comparação de fotos de vistoria, focada na LATARIA (o fundo é ignorado):
   1) normaliza as fotos para 4:3 em 256×192 (4× mais detalhe que a v3, para enxergar riscos finos);
   2) alinhamento por pirâmide (32×24 → 256×192): escala 0,6×–1,7× e deslocamento, correlação normalizada de
      gradientes; se não houver correspondência, é "enquadramento diferente" (e não avaria);
   3) normalização de luz por canal (mediana do ganho, ignorando pixels estourados);
   4) MÁSCARA DA LATARIA: região contínua onde as duas fotos concordam em luz, cor e estrutura (o carro é o mesmo;
      o fundo muda). Fecha buracos (riscos/amassados ficam DENTRO da máscara) e recua a borda (silhueta);
   5) dentro da máscara: erro fino = luz, cor e BORDAS NOVAS/AUSENTES (com tolerância de ±3 px ao alinhamento);
      agrupa em manchas e avalia tamanho e contraste. Diferenças fora da máscara (fundo, outro carro ao lado) não contam.
   Retorno padronizado: {status, sim, cells, boxes, regions, text, engine, framing, ncc, align, body}. */
const VIS={CLF:null,DETECT:false,ML_BASE:'ml/',W:256,H:192,GX:8,GY:6,NCC_FRAMING:.28,MIN_BODY:.10,T_MASK:1,T_EDGE:13,MIN_EDGE:64,MIN_TONE:90,MIN_STRONG:24,MISS_MAX:.35,NCC_SAME:.7,MIN_CENTER:.5,T_SMOOTH:14,MIN_PAINT:.5,MIN_PAINT_BIG:.4,NCC_CAR:.6,MAX_ASPECT:.3,BRIGHT_L:228,MAX_BRIGHT:.15};
async function visLoad(src,W,H){const im=await loadImg(src);const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});
 const ar=W/H,iar=im.width/im.height;let sw=im.width,sh=im.height,sx=0,sy=0;if(iar>ar){sw=im.height*ar;sx=(im.width-sw)/2}else{sh=im.width/ar;sy=(im.height-sh)/2}
 x.drawImage(im,sx,sy,sw,sh,0,0,W,H);const d=x.getImageData(0,0,W,H).data,n=W*H,r=new Float32Array(n),g=new Float32Array(n),b=new Float32Array(n),l=new Float32Array(n);
 for(let i=0;i<n;i++){r[i]=d[i*4];g[i]=d[i*4+1];b[i]=d[i*4+2];l[i]=.299*r[i]+.587*g[i]+.114*b[i]}return{r,g,b,l,W,H,crop:{sx,sy,sw,sh}}}
// detector de veículo (COCO-SSD lite quantizado, ~6 MB, carregado só na 1ª análise; roda no aparelho). Sem ele, a análise segue pelo modo reserva.
const visScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('falha ao carregar '+src));document.head.appendChild(s)});
let _visML=null;const _visCars=new Map();
function visModel(){if(!_visML)_visML=(async()=>{await visScript(VIS.ML_BASE+'tf.min.js');await visScript(VIS.ML_BASE+'coco-ssd.min.js');let ok=false;try{ok=await tf.setBackend('webgl')}catch(e){}if(!ok||tf.getBackend()!=='webgl')await tf.setBackend('cpu');await tf.ready();
  return cocoSsd.load({base:'lite_mobilenet_v2',modelUrl:VIS.ML_BASE+'modelo/model.json'})})().catch(e=>{VIS._mlFailed=true;console.warn('detector de veículo indisponível; seguindo sem ele',e);return null});return _visML}
async function visCar(src){if(_visCars.has(src))return _visCars.get(src);const m=await visModel();let out=null;if(m){try{const im=await loadImg(src),d=(await m.detect(im,8,.15)).filter(x=>['car','truck','bus'].includes(x.class)&&x.score>=.15);
  if(d.length){d.sort((a,b)=>b.bbox[2]*b.bbox[3]*b.score-a.bbox[2]*a.bbox[3]*a.score);out={bbox:d[0].bbox,score:d[0].score}}}catch(e){console.warn('detecção falhou',e)}}
 if(_visCars.size>12)_visCars.clear();_visCars.set(src,out);return out}
// média móvel separável (borda replicada), raio r
function visBox(a,W,H,r){const t=new Float32Array(a.length),o=new Float32Array(a.length),n=2*r+1;
 for(let y=0;y<H;y++){const row=y*W;let s=0;for(let k=-r;k<=r;k++)s+=a[row+Math.min(W-1,Math.max(0,k))];for(let x=0;x<W;x++){t[row+x]=s/n;s+=a[row+Math.min(W-1,x+r+1)]-a[row+Math.max(0,x-r)]}}
 for(let x=0;x<W;x++){let s=0;for(let k=-r;k<=r;k++)s+=t[Math.min(H-1,Math.max(0,k))*W+x];for(let y=0;y<H;y++){o[y*W+x]=s/n;s+=t[Math.min(H-1,y+r+1)*W+x]-t[Math.max(0,y-r)*W+x]}}return o}
function visMaxF(a,W,H,r){const t=new Float32Array(a.length),o=new Float32Array(a.length);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let m=-1e9;for(let k=-r;k<=r;k++){const xx=x+k;if(xx>=0&&xx<W){const v=a[y*W+xx];if(v>m)m=v}}t[y*W+x]=m}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let m=-1e9;for(let k=-r;k<=r;k++){const yy=y+k;if(yy>=0&&yy<H){const v=t[yy*W+x];if(v>m)m=v}}o[y*W+x]=m}return o}
function visDown(a,W,H){const w=W>>1,h=H>>1,o=new Float32Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++)o[y*w+x]=(a[2*y*W+2*x]+a[2*y*W+2*x+1]+a[(2*y+1)*W+2*x]+a[(2*y+1)*W+2*x+1])/4;return o}
function visGrad(a,W,H){const o=new Float32Array(a.length);for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const gx=a[y*W+x+1]-a[y*W+x-1],gy=a[(y+1)*W+x]-a[(y-1)*W+x];o[y*W+x]=Math.sqrt(gx*gx+gy*gy)}return o}
// amostra a imagem "a" no ponto transformado x' = cx + (x-cx)*s + dx (bilinear); s<1 amplia a imagem
function visWarp(a,W,H,s,dx,dy){const o=new Float32Array(W*H),cx=W/2,cy=H/2;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let X=cx+(x-cx)*s+dx,Y=cy+(y-cy)*s+dy;X=Math.max(0,Math.min(W-1.001,X));Y=Math.max(0,Math.min(H-1.001,Y));const x0=X|0,y0=Y|0,fx=X-x0,fy=Y-y0,i=y0*W+x0;
 o[y*W+x]=a[i]*(1-fx)*(1-fy)+a[i+1]*fx*(1-fy)+a[i+W]*(1-fx)*fy+a[i+W+1]*fx*fy}return o}
function visValid(W,H,s,dx,dy){const o=new Uint8Array(W*H),cx=W/2,cy=H/2;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const X=cx+(x-cx)*s+dx,Y=cy+(y-cy)*s+dy;o[y*W+x]=X>=0&&Y>=0&&X<=W-1&&Y<=H-1?1:0}return o}
function visNCC(A,B,W,H,m){let sa=0,sb=0,n=0;for(let y=m;y<H-m;y++)for(let x=m;x<W-m;x++){sa+=A[y*W+x];sb+=B[y*W+x];n++}const ma=sa/n,mb=sb/n;let num=0,da=0,db=0;
 for(let y=m;y<H-m;y++)for(let x=m;x<W-m;x++){const a=A[y*W+x]-ma,b=B[y*W+x]-mb;num+=a*b;da+=a*a;db+=b*b}return num/Math.sqrt(da*db+1e-9)}
// correlação normalizada só dentro de uma região (retângulo do carro): o fundo não entra na conta
function visNCCbox(A,B,W,H,bx,m){const x0=Math.max(m,Math.round(bx.x0)),x1=Math.min(W-m,Math.round(bx.x1)),y0=Math.max(m,Math.round(bx.y0)),y1=Math.min(H-m,Math.round(bx.y1));if(x1-x0<4||y1-y0<4)return -1;
 let sa=0,sb=0,n=0;for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){sa+=A[y*W+x];sb+=B[y*W+x];n++}const ma=sa/n,mb=sb/n;let num=0,da=0,db=0;
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const a=A[y*W+x]-ma,b=B[y*W+x]-mb;num+=a*b;da+=a*a;db+=b*b}return num/Math.sqrt(da*db+1e-9)}
// retângulo do veículo (detector) -> coordenadas do quadro de análise (corte 4:3 "cover")
function visBoxFrame(d,cr,W,H){const [bx,by,bw,bh]=d.bbox;return{x0:Math.max(0,(bx-cr.sx)/cr.sw*W),x1:Math.min(W,(bx+bw-cr.sx)/cr.sw*W),y0:Math.max(0,(by-cr.sy)/cr.sh*H),y1:Math.min(H,(by+bh-cr.sy)/cr.sh*H),score:d.score}}
// alinhamento a partir dos retângulos do carro nas DUAS fotos (normaliza distância e posição) + refino só dentro do carro
function visAlignBox(P,C,bP,bC){const W=P.W,H=P.H;let pl=[P.l],cl=[C.l],ws=[W],hs=[H];
