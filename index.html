async function frame43(src,W=800,H=600,q=.8){const im=await loadImg(src),ar=W/H,iar=im.width/im.height;let sw=im.width,sh=im.height,sx=0,sy=0;if(iar>ar){sw=im.height*ar;sx=(im.width-sw)/2}else{sh=im.width/ar;sy=(im.height-sh)/2}
 const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,W,H);return c.toDataURL('image/jpeg',q).split(',')[1]}
const edgeToItem=r=>({status:r.status,sim:r.sim??null,cells:r.cells||[],boxes:r.boxes||[],regions:r.regions||[],text:r.text||'',framing:!!r.framing,danos:r.danos||[],model:r.model||null,engine:r.engine||'ia'});
async function analyzeAngle(prevSrc,curSrc,ctx={}){
 if(CONFIG.AI_ENGINE==='edge'&&!DEMO&&ctx.angle!=='painel'){try{const [a,b]=await Promise.all([frame43(prevSrc),frame43(curSrc)]),r=await api.analyzeEdge(a,b,ctx);
   if(r&&['ok','warn','bad'].includes(r.status)){const it=edgeToItem(r);
    if(CONFIG.AI_COMPARE_LOCAL){try{const l=await analyzeAngleLocal(prevSrc,curSrc,ctx);it.local={status:l.status,framing:l.framing,boxes:l.boxes,detector:l.detector}}catch(e){}}   // guarda também o que o analisador local concluiu, para comparar IA × local
    return it}}
  catch(e){console.warn('análise por IA falhou',e);throw e}}
 return analyzeAngleLocal(prevSrc,curSrc,ctx)}
const cellsHTML=(cells,boxes)=>boxes&&boxes.length?boxes.map(b=>`<div class="dbox" style="left:${(b.x*100).toFixed(2)}%;top:${(b.y*100).toFixed(2)}%;width:${(b.w*100).toFixed(2)}%;height:${(b.h*100).toFixed(2)}%"></div>`).join(''):(cells||[]).map(c=>`<div class="cell" style="left:${c.cx*12.5}%;top:${c.cy*16.6667}%;background:rgba(220,38,38,${Math.min(.5,.15+(c.s||.5)/4)})"></div>`).join('');
const iBadge=i=>i.framing?'<span class="badge b-info">Enquadramento diferente</span>':({ok:'<span class="badge b-ok">Sem alterações</span>',warn:'<span class="badge b-warn">Atenção</span>',bad:'<span class="badge b-bad">Possível avaria</span>',baseline:'<span class="badge b-info">Sem referência</span>',noai:'<span class="badge b-info">Analisador IA excedido</span>',skipped:'<span class="badge b-bad">Foto pulada</span>'}[i.status]||'')+(i.sim!=null?` <span class="small mut">${i.sim}%</span>`:'');
async function fileToData(file,max=1024){const u=URL.createObjectURL(file);try{const im=await loadImg(u);const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72)}finally{URL.revokeObjectURL(u)}}

/* ======================= câmera (lanterna, câmera nativa, aviso de pouca luz) ======================= */
let CAP=null,stream=null,torchOn=false,lightTimer=null;
async function capture(cb,o={}){CAP=cb;
 try{if(!navigator.mediaDevices?.getUserMedia)throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  const track=stream.getVideoTracks()[0],caps=track.getCapabilities?track.getCapabilities():{};torchOn=false;
  $('#cam').innerHTML=`<video id="vid" autoplay playsinline muted></video>${o.ghost?`<img class="ghost" id="ghost" src="${o.ghost}">`:''}<div class="grid3"></div>
  <div class="top"><b>${esc(o.title||'Foto')}</b><br>${esc(o.text||'')}${o.ghost?'<br><i>Alinhe o carro com a imagem semitransparente da referência.</i>':''}<div id="lowLight" class="warnbox" style="display:${isNight()?'block':'none'}">Está escuro: ${caps.torch?'ative a 🔦 lanterna':'use "Câmera do aparelho" e ative o flash'}.</div></div>
  <div class="bot"><button class="btn" onclick="closeCam()">Fechar</button>${caps.torch?`<button class="btn" id="torchB" onclick="toggleTorch()">🔦 Lanterna</button>`:''}<button class="shot" onclick="snap()" aria-label="Fotografar"></button>
  ${o.ghost?`<button class="btn" onclick="const g=$('#ghost');g.style.display=g.style.display==='none'?'block':'none'">Sobreposição</button>`:''}<button class="btn" onclick="closeCam();$('#fileIn').click()">Câmera do aparelho${caps.torch?'':' (flash)'}</button></div>`;
  $('#cam').classList.add('on');$('#vid').srcObject=stream;
  clearInterval(lightTimer);lightTimer=setInterval(()=>{const v=$('#vid');if(!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=32;c.height=24;const x=c.getContext('2d');x.drawImage(v,0,0,32,24);const d=x.getImageData(0,0,32,24).data;let m=0;for(let i=0;i<d.length;i+=4)m+=(d[i]+d[i+1]+d[i+2])/3;m/=768;const ll=$('#lowLight');if(ll)ll.style.display=(m<60||isNight())&&!torchOn?'block':'none'},1000)}
 catch(e){toast('Câmera ao vivo indisponível: abrindo a câmera do aparelho (use o flash se estiver escuro)');$('#fileIn').click()}}
async function toggleTorch(){const t=stream?.getVideoTracks()[0];if(!t)return;torchOn=!torchOn;try{await t.applyConstraints({advanced:[{torch:torchOn}]});$('#torchB').textContent=torchOn?'🔦 Desligar':'🔦 Lanterna'}catch(e){torchOn=false;toast('Não foi possível ligar a lanterna')}}
function pickFile(cb){CAP=cb;$('#fileIn').click()}
function closeCam(){clearInterval(lightTimer);stream?.getTracks().forEach(t=>t.stop());stream=null;$('#cam').classList.remove('on');$('#cam').innerHTML=''}
function snap(){const v=$('#vid');if(!v.videoWidth)return;const sc=Math.min(1,1024/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=v.videoWidth*sc;c.height=v.videoHeight*sc;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const src=c.toDataURL('image/jpeg',.72);closeCam();CAP&&CAP(src)}
$('#fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f&&CAP)CAP(await fileToData(f))};
const TESTB=()=>DEMO||CONFIG.TEST_PHOTOS;

/* ======================= VISTORIA (retirada e devolução) ======================= */
async function startVistoria(bid,kind){const b=D.bookings.find(x=>x.id===bid);closeModal();if(!b)return;
 if(kind==='retirada'&&!canPickup(b))return toast('Vistoria de retirada liberada a partir de 00:00 do dia da reserva');
 const v=V(b.vehicle_id);if(!v)return toast('Veículo não encontrado');busy(true,'Carregando a vistoria de referência...');
 try{let ref=null,ck;
  if(kind==='retirada'){ck='retirada_vs_devolucao_anterior';ref=(await api.rpc('reference_inspection',{p_vehicle:v.id,p_kind:'devolucao'}))[0]||(await api.rpc('reference_inspection',{p_vehicle:v.id,p_kind:null}))[0]||null}
  else{ck='devolucao_vs_retirada';const own=(await api.select('inspections',{f:[['eq','booking_id',b.id],['eq','kind','retirada']],order:'created_at',desc:true}))[0];
   ref=own&&Object.keys(own.photos||{}).length?{id:own.id,created_at:own.created_at,kind:own.kind,photos:own.photos}:((await api.rpc('reference_inspection',{p_vehicle:v.id,p_kind:null,p_before:b.started_at||nowISO()}))[0]||null)}
  const refUrls={};if(ref)await Promise.all(Object.entries(ref.photos||{}).filter(([k])=>ANGLES.some(a=>a.k===k)).map(async([k,p])=>{try{refUrls[k]=URL.createObjectURL(await api.photoBlob(p))}catch(e){}}));
  PK={kind,ck,b,v,id:uuid(),step:0,pi:-1,km:kind==='retirada'?v.km_current:'',fuel:null,parking:'',incident:kind==='devolucao'?null:false,photos:{},quality:{},checks:{},extras:[],notes:'',ref,refUrls,analysis:null,saved:false,skipped:[],ack:null};
  view='vistoria';render();window.scrollTo(0,0)}catch(e){toast('Erro: '+e.message,6000)}finally{busy(false)}}
const skipMark=s=>{if(!PK.skipped.includes(s))PK.skipped.push(s)};
const unskip=s=>{PK.skipped=PK.skipped.filter(x=>x!==s)};
/* termo de responsabilidade: ação deliberada (checkbox + confirmar) */
function requireAck(then){if(PK.ack)return then();
 openModal(`<h3>⚠ Seguir sem o registro completo?</h3><div class="term">${esc(SKIP_TEXT)}</div>
 <label class="ck" style="margin-top:12px"><input type="checkbox" id="ackCk" onchange="$('#ackOk').disabled=!this.checked"> Li e assumo a responsabilidade descrita acima.</label>
 <label>Motivo (opcional)</label><input id="ackWhy" placeholder="Ex.: chuva forte, sem tempo hábil, compromisso da diretoria">
 <div class="row" style="margin-top:12px"><button class="btn bad" id="ackOk" disabled onclick="ackOk()">Confirmar e seguir</button><button class="btn" onclick="closeModal()">Voltar e fazer a vistoria</button></div>`);ackOk.then=then}
function ackOk(){if(!$('#ackCk').checked)return;PK.ack={at:nowISO(),text:SKIP_TEXT,reason:$('#ackWhy').value.trim()||null};closeModal();ackOk.then&&ackOk.then()}
function fallbackData(){if(PK.km===''||PK.km==null||isNaN(Number(PK.km)))PK.km=PK.kind==='retirada'?PK.v.km_current:(PK.b.km_start??PK.v.km_current);if(PK.fuel==null)PK.fuel=PK.kind==='retirada'?Number(PK.v.fuel_level):(PK.b.fuel_start??Number(PK.v.fuel_level));if(PK.incident===null)PK.incident=false}
function skipStep(){requireAck(()=>{
 if(PK.step===0){skipMark('dados');fallbackData();PK.step=1;PK.pi=0}
 else if(PK.step===1){const a=ANGLES[PK.pi>=0?PK.pi:0];delete PK.photos[a.k];skipMark('foto:'+a.k);if(PK.pi<ANGLES.length-1)PK.pi=Math.max(0,PK.pi)+1;else PK.step=2}
 else if(PK.step===2){skipMark('checklist');return vsRun()}
 render();window.scrollTo(0,0)})}
function skipAll(){requireAck(()=>{if(PK.step===0||PK.km===''||PK.fuel==null){if(PK.km===''||PK.fuel==null)skipMark('dados');fallbackData()}
 ANGLES.forEach(a=>{if(!PK.photos[a.k])skipMark('foto:'+a.k)});if(CHECKS.some(([k])=>!PK.checks[k]))skipMark('checklist');vsRun()})}
VIEWS.vistoria=()=>{if(!PK)return VIEWS.inicio();const st=['Dados','Fotos','Checklist','Análise'];const sk=i=>i===0?PK.skipped.includes('dados'):i===1?PK.skipped.some(s=>s.startsWith('foto:')):i===2?PK.skipped.includes('checklist'):false;
 return`<h2>Vistoria de ${PK.kind==='retirada'?'retirada':'devolução'}</h2><p class="small mut">${esc(PK.v.plate)} · ${esc(PK.v.model)}${PK.v.color?' ('+esc(PK.v.color)+')':''} · condutor ${esc(pName(PK.b.driver_id))}</p>
 <div class="steps">${st.map((s,i)=>`<div class="${i===PK.step?'on':sk(i)?'skip':i<PK.step?'done':''}">${i+1}. ${s}</div>`).join('')}</div>
 ${PK.ack?`<div class="badbox" style="margin:0 0 10px">Vistoria incompleta · termo de responsabilidade aceito às ${fmtT(PK.ack.at)}${PK.skipped.length?' · pulado: '+esc(PK.skipped.map(s=>s.startsWith('foto:')?angL(s.slice(5)):s).join(', ')):''}</div>`:''}
 ${[vsDados,vsFotos,vsCheck,vsAnalise][PK.step]()}
 ${PK.step<3?`<div class="row" style="margin-top:14px;justify-content:center"><button class="btn ghost sm" onclick="skipAll()">Seguir sem concluir a vistoria</button></div>`:''}`};
function vsDados(){const v=PK.v,b=PK.b,ret=PK.kind==='retirada';
 return`<div class="card">${ret?`<div class="${PK.ref?'infobox':'warnbox'}" style="margin-top:0">${PK.ref?`Referência: vistoria de ${PK.ref.kind==='devolucao'?'devolução':'retirada'} de ${fmtDT(PK.ref.created_at)}. Suas fotos serão comparadas com ela; diferenças encontradas agora ficam registradas como anteriores ao seu uso.`:'Este veículo ainda não tem fotos de referência. As suas serão a base das próximas comparações.'}</div>
  <p class="small">Último registro: <b>${fmtKm(v.km_current)}</b> · combustível <b>${fuelL(Number(v.fuel_level))}</b></p>`
  :`<div class="infobox" style="margin-top:0">Retirado em ${fmtDT(b.started_at)} com ${fmtKm(b.km_start)} e ${fuelL(b.fuel_start)}. As fotos de devolução serão comparadas com as da retirada: diferenças indicam dano ocorrido durante este uso.</div>`}
 <label>KM ${ret?'inicial':'final'} (hodômetro) *</label><input type="number" inputmode="numeric" value="${esc(PK.km)}" oninput="PK.km=this.value">
 <label>Nível de combustível no marcador *</label><div id="pkFuel">${fuelSeg(PK.fuel,'pkSetFuel')}</div>
 ${ret?'':`<label>Onde o veículo foi estacionado? (vaga/local)</label><input value="${esc(PK.parking)}" oninput="PK.parking=this.value" placeholder="Ex.: vaga 12, pátio">
 <label>Houve algum incidente, dano ou problema durante o uso? *</label><div class="seg"><button class="${PK.incident===false?'on ok':''}" onclick="PK.incident=false;render()">Não</button><button class="${PK.incident===true?'on is':''}" onclick="PK.incident=true;render()">Sim</button></div>
 ${PK.incident?'<div class="badbox">Descreva e fotografe o dano no passo "Checklist" (fotos de detalhe). Informar agora evita que ele seja apontado na vistoria do próximo condutor sem explicação.</div>':''}`}
 <p class="small mut">Destino: ${esc(b.destination)} · previsto ${fmtDT(b.start_at)} → ${fmtDT(b.end_at)}</p></div>
 <div class="row sp"><button class="btn" onclick="go('inicio')">Cancelar</button><div class="row"><button class="btn ghost" onclick="skipStep()">Pular esta etapa</button><button class="btn pri" onclick="vsNext0()">Continuar para as fotos →</button></div></div>`}
function pkSetFuel(v){PK.fuel=v;$('#pkFuel').innerHTML=fuelSeg(v,'pkSetFuel')}
function vsNext0(){const km=Number(PK.km);if(PK.km===''||isNaN(km))return toast('Informe o KM do hodômetro');if(PK.fuel==null)return toast('Informe o nível de combustível');
 if(PK.kind==='retirada'&&km<PK.v.km_current&&!confirm(`O KM informado (${km}) é menor que o último registrado (${PK.v.km_current}). Confira o hodômetro. Continuar mesmo assim?`))return;
 if(PK.kind==='devolucao'){if(PK.b.km_start!=null&&km<PK.b.km_start)return toast(`O KM final não pode ser menor que o inicial (${PK.b.km_start})`);if(PK.incident===null)return toast('Informe se houve incidente');if(PK.b.km_start!=null&&km-PK.b.km_start>1500&&!confirm(`${km-PK.b.km_start} km rodados. Confirma o KM?`))return}
 unskip('dados');PK.step=1;PK.pi=-1;render();window.scrollTo(0,0)}
function carSVG(pos){return`<svg viewBox="0 0 120 160" width="104" height="138" style="flex:none"><rect x="30" y="20" width="60" height="120" rx="20" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="38" y="46" width="44" height="26" rx="6" fill="#94a3b8"/><rect x="38" y="96" width="44" height="22" rx="6" fill="#94a3b8"/><circle cx="40" cy="24" r="4" fill="#facc15"/><circle cx="80" cy="24" r="4" fill="#facc15"/><text x="60" y="36" font-size="8" text-anchor="middle" fill="#475569">FRENTE</text><text x="60" y="134" font-size="8" text-anchor="middle" fill="#475569">TRÁS</text>${ANGLES.map(a=>`<circle cx="${a.pos[0]}" cy="${a.pos[1]}" r="4" fill="#cbd5e1"/>`).join('')}<circle cx="${pos[0]}" cy="${pos[1]}" r="9" fill="#ea580c"/><text x="${pos[0]}" y="${pos[1]+3}" font-size="9" text-anchor="middle">📷</text></svg>`}
function vsFotos(){
 if(PK.pi===-1)return`<div class="card"><h3>Como fotografar para a comparação funcionar</h3><ul class="tips">
 <li><b>5 fotos:</b> frente com os <b>faróis acesos</b>, lateral esquerda, traseira, lateral direita e <b>painel com o carro ligado</b>.</li>
 <li><b>Celular deitado (paisagem)</b> e sem zoom: aproxime-se andando, não com os dedos.</li>
 <li><b>Sempre do mesmo ponto:</b> siga o diagrama (~3 m, altura do peito).${Object.keys(PK.refUrls).length?' A foto de referência aparece <b>semitransparente na câmera</b> para você repetir o enquadramento.':''}</li>
 <li><b>Sem contra-luz.</b> ${isNight()?'<b style="color:var(--warn)">Está de noite: use a 🔦 lanterna ou o flash.</b>':'À noite ou em local escuro, use a lanterna/flash.'}</li>
 <li>Viu um dano? Fotografe também de perto (~40 cm) no passo seguinte. Isso protege você.</li></ul></div>
 <div class="row sp"><button class="btn" onclick="PK.step=0;render()">← Voltar</button><button class="btn pri" onclick="PK.pi=0;render()">Iniciar fotos →</button></div>`;
 const a=ANGLES[PK.pi],ph=PK.photos[a.k],q=PK.quality[a.k],pv=PK.refUrls[a.k],done=ANGLES.filter(x=>PK.photos[x.k]).length,skipped=PK.skipped.includes('foto:'+a.k);
 return`<div class="dots">${ANGLES.map((x,i)=>`<i class="${PK.photos[x.k]?'done':PK.skipped.includes('foto:'+x.k)?'skip':''} ${i===PK.pi?'cur':''}" onclick="PK.pi=${i};render()" title="${esc(x.l)}"></i>`).join('')}</div>
 <div class="card"><div class="row sp"><h3>Foto ${PK.pi+1}/${ANGLES.length} · ${esc(a.l)}</h3><span class="small mut">${done}/${ANGLES.length}</span></div>
 <div class="row" style="flex-wrap:nowrap;align-items:flex-start;margin:6px 0">${carSVG(a.pos)}<p style="margin:0">${esc(a.t)}</p></div>
 ${isNight()&&a.k!=='painel'?'<div class="warnbox">Está escuro: ative o flash/lanterna antes de fotografar.</div>':''}
 ${skipped&&!ph?'<div class="badbox">Foto pulada (termo aceito). Você ainda pode fotografar agora.</div>':''}
 ${ph?`<div class="imgbox"><span class="tag">Sua foto</span><img src="${ph}"></div>${q?.issues?.length?`<div class="warnbox"><b>Atenção:</b> ${q.issues.map(esc).join(' ')} Recomendamos refazer.</div>`:q?.tips?.length?`<div class="warnbox">${q.tips.map(esc).join(' ')}</div>`:'<div class="okbox">Boa qualidade de foto.</div>'}`
  :pv?`<div class="imgbox"><span class="tag">Referência (${fmtD(PK.ref.created_at)})</span><img src="${pv}"></div>`:''}
 <div class="row" style="margin-top:10px"><button class="btn pri" onclick="vsShoot()">📷 ${ph?'Refazer':'Tirar'} foto</button><button class="btn" onclick="pickFile(vsSetPhoto)">Câmera do aparelho / galeria</button>
 ${TESTB()?`<button class="btn sm" onclick="vsTest('none')">🧪 Teste</button><button class="btn sm" onclick="vsTest('medium')">🧪 Teste c/ avaria</button>${a.k==='frente'?`<button class="btn sm" onclick="vsTest('nolights')">🧪 Faróis apagados</button>`:''}`:''}</div></div>
 <div class="row sp"><button class="btn" onclick="PK.pi--;render()">← Anterior</button><div class="row"><button class="btn ghost" onclick="skipStep()">Pular esta foto</button>${PK.pi<ANGLES.length-1?`<button class="btn pri" ${ph?'':'disabled'} onclick="PK.pi++;render()">Próxima →</button>`:`<button class="btn pri" ${ph?'':'disabled'} onclick="vsNext1()">Concluir fotos →</button>`}</div></div>`}
function vsShoot(){const a=ANGLES[PK.pi];capture(vsSetPhoto,{title:a.l,text:a.t,ghost:PK.refUrls[a.k]})}
async function vsSetPhoto(src){const k=ANGLES[PK.pi].k;PK.photos[k]=src;unskip('foto:'+k);PK.quality[k]=await quality(src,k);render()}
function vsTest(kind){const a=ANGLES[PK.pi];return vsSetPhoto(demoImage(PK.v.plate+'|'+a.k,a.l+' (teste)',kind==='nolights'?{lights:false}:{damage:kind}))}
function vsNext1(){const miss=ANGLES.filter(a=>!PK.photos[a.k]&&!PK.skipped.includes('foto:'+a.k));if(miss.length){toast('Faltam fotos: '+miss.map(m=>m.l).join(', '));PK.pi=ANGLES.indexOf(miss[0]);return render()}PK.step=2;render();window.scrollTo(0,0)}
function vsCheck(){return`<div class="card"><h3>Checklist</h3>${CHECKS.map(([k,l])=>`<div class="chk"><span>${esc(l)}</span><div class="seg"><button class="ok ${PK.checks[k]==='ok'?'on':''}" onclick="PK.checks['${k}']='ok';render()">OK</button><button class="is ${PK.checks[k]==='issue'?'on':''}" onclick="PK.checks['${k}']='issue';render()">Problema</button></div></div>`).join('')}
 <label>Observações</label><textarea oninput="PK.notes=this.value">${esc(PK.notes)}</textarea></div>
 <div class="card"><h3>Fotos de detalhe ${PK.incident?'(descreva o incidente) *':'(opcional)'}</h3><p class="small mut">Fotografe de perto (~40 cm) riscos, amassados ou problemas e descreva. Coloque a mão ou uma moeda ao lado para dar noção de tamanho.</p>
 <div class="thumbs" style="margin-bottom:8px">${PK.extras.map((e,i)=>`<div style="width:92px"><img src="${e.img}" style="width:92px;height:68px"><div class="small">${e.damage?'⚠ ':''}${esc(e.note)} <a href="#" onclick="PK.extras.splice(${i},1);render();return false">remover</a></div></div>`).join('')}</div>
 <button class="btn" onclick="addExtra()">📷 Adicionar foto de detalhe</button></div>
 <div class="row sp"><button class="btn" onclick="PK.step=1;PK.pi=ANGLES.length-1;render()">← Voltar</button><div class="row"><button class="btn ghost" onclick="skipStep()">Pular esta etapa</button><button class="btn pri" onclick="vsNext2()">Analisar fotos →</button></div></div>`}
function vsNext2(){if(CHECKS.some(([k])=>!PK.checks[k]))return toast('Marque OK ou Problema em cada item (ou pule a etapa)');if(PK.incident&&!PK.extras.length&&!PK.notes.trim())return toast('Descreva ou fotografe o incidente');unskip('checklist');vsRun()}
function addExtra(){const note=prompt('Descreva o que está na foto (ex.: risco na porta dianteira direita):','');if(note===null)return;
 const damage=PK.kind==='devolucao'&&PK.incident?true:confirm('Isso é uma avaria/dano no veículo?\n\nOK = sim, é um dano · Cancelar = apenas observação');

 {const due=lastDue(today());NCHK().forEach(v=>{if(!D.checklists.some(k=>k.vehicle_id===v.id&&k.due_date===due))R(due<today()?'bad':'warn',`📋 ${v.plate}: checklist NOSBEB de ${fmtD(due)} ${due<today()?'atrasado':'pendente hoje'}`,'checklist')})}

 D.vehicles.filter(v=>v.status!=='inativo').forEach(v=>{const f=fuelInfo(v);if(f.st!=='ok')R(f.st,`⛽ ${v.plate}: ${f.msg}`,'abastecimento');
  [['oil','Troca de óleo'],['tire','Troca de pneus'],['prev','Manutenção preventiva']].forEach(([px,l])=>{const m=maintStatus(v,px);if(m.st==='bad'||m.st==='warn')R(m.st,`🔧 ${v.plate}: ${l} ${m.txt}`,'manutencao')});
  const tp=tpStatus(v);if(tp.st==='bad'||tp.st==='warn')R(tp.st,`🛞 ${v.plate}: calibragem ${tp.txt}`,'manutencao');
  const ms=missingSafety(v);if(ms.length)R('warn',`🧰 ${v.plate}: faltando no porta-malas: ${ms.join(', ')}`,'veiculos');

 return`<div class="card"><h3>⛽ Solicitações de abastecimento vindas do checklist (${L.length})</h3><p class="small mut">Combustível abaixo de 1/4 informado pelo motorista. Registrar o abastecimento encerra a pendência; nenhum abastecimento ou despesa é criado automaticamente.</p>
 ${L.map(f=>{const k=D.checklists.find(x=>x.id===f.checklist_id);return`<div class="al row sp"><span><b>${esc(V(f.vehicle_id)?.plate||'')}</b> ${esc(V(f.vehicle_id)?.model||'')} · ${esc(pName(f.requested_by)||k?.driver_name||'')} · ${fmtDT(f.created_at)}</span><span class="row">${k?`<button class="btn sm" onclick="openChecklistDetail('${k.id}')">Checklist</button>`:''}<button class="btn sm pri" onclick="refuelForm('${f.vehicle_id}')">Registrar abastecimento</button>${isG()?`<button class="btn sm" onclick="cancelFuelReq('${f.id}')">Cancelar</button>`:''}</span></div>`}).join('')}</div>`}
async function cancelFuelReq(id){if(!confirm('Cancelar esta solicitação de abastecimento?'))return;try{await api.update('fuel_requests',id,{status:'cancelada',resolved_at:nowISO()});await refresh()}catch(e){toast(e.message)}}
VIEWS.checklist=()=>{const t=today(),[tue,thu]=weekDues(),fd=typeof VARG==='string'?VARG:'',hist=D.checklists.filter(k=>!fd||k.inspected_by===fd).slice(0,100),drivers=[...new Map(D.checklists.map(k=>[k.inspected_by,k.driver_name||pName(k.inspected_by)])).entries()],occ=D.checklists.filter(k=>k.condition==='problema'&&Date.now()-new Date(k.created_at)<30*864e5);
 return`<div class="row sp"><h2>Checklist · frota NOSBEB</h2></div>
 <div class="infobox" style="margin:0 0 12px">Inspeção às <b>terças e quintas-feiras</b> (esta semana: ${fmtD(tue)} e ${fmtD(thu)}), preenchida pelo próprio motorista logado: 18 itens, fotos da água e do óleo, KM e nível de combustível. O responsável fica registrado automaticamente.</div>
 ${fuelReqCard()}
 ${NCHK().map(v=>`<div class="card"><div class="row sp"><div><b>${esc(v.plate)} · ${esc(v.model)}</b> <span class="tag2">${esc(companyName(v)||'NOSBEB')}</span><br><span class="small">${[['Terça',tue],['Quinta',thu]].map(([n,d])=>{const s=chkStat(v,d);return`${n} ${fmtD(d).slice(0,5)}: <span class="badge ${s[0]}">${s[1]}</span>`}).join(' · ')}</span><br><span class="small mut">${fmtKm(v.km_current)}</span></div>
  <button class="btn sm" onclick="openChecklist('${v.id}')">📋 Fazer checklist</button></div></div>`).join('')||'<div class="card mut">Nenhum veículo da frota NOSBEB. Vincule os veículos à empresa NOSBEB em Veículos › Editar.</div>'}
 <div class="card"><h3>Ocorrências: não conformidades (30 dias)</h3>${occ.map(k=>`<div class="al" style="cursor:pointer" onclick="openChecklistDetail('${k.id}')"><b>${esc(V(k.vehicle_id)?.plate||'')}</b> ${esc(V(k.vehicle_id)?.model||'')} · ${esc(k.driver_name||pName(k.inspected_by))} · ${fmtDT(k.created_at)}<br><span class="small" style="color:var(--bad)">${Object.entries(k.items||{}).filter(([,x])=>x.status==='nao_conforme').map(([c,x])=>esc(itemLabel(c))+(x.note?' ('+esc(x.note)+')':'')).join(' · ')}</span></div>`).join('')||'<p class="small mut">Nenhuma ocorrência.</p>'}</div>
 <div class="card tw"><div class="row sp"><h3>Histórico de checklists</h3><select style="width:auto" onchange="go('checklist',this.value)"><option value="">Todos os motoristas</option>${drivers.map(([id,n])=>`<option value="${id}" ${fd===id?'selected':''}>${esc(n)} (${D.checklists.filter(k=>k.inspected_by===id).length})</option>`).join('')}</select></div><table><tr><th>Data</th><th>Veículo</th><th>Motorista</th><th>Ref.</th><th>Resultado</th><th>KM</th><th></th></tr>${hist.map(k=>`<tr><td>${fmtDT(k.created_at)}</td><td><b>${esc(V(k.vehicle_id)?.plate||'')}</b><br><span class="small mut">${esc(V(k.vehicle_id)?.model||'')}</span></td><td>${esc(k.driver_name||pName(k.inspected_by))}</td><td>${fmtD(k.due_date)}${k.on_schedule?'':' <span class="small mut">(fora do dia)</span>'}</td>
 <td><span class="badge ${CND[k.condition][0]}">${CND[k.condition][1]}</span>${k.fuel_ok===false?' <span class="badge b-warn">abastecer</span>':''}${k.km_flag?' <span class="badge b-warn">KM menor</span>':''}</td><td>${fmtKm(k.km)}</td><td><button class="btn sm" onclick="openChecklistDetail('${k.id}')">Abrir</button></td></tr>`).join('')||'<tr><td colspan="7" class="mut">Nenhum checklist registrado.</td></tr>'}</table></div>`};
function openPhoto(src){if(!src)return;openModal(`<div class="row sp"><h3>Foto</h3><button class="btn sm" onclick="closeModal()">✕</button></div><img src="${src}" style="width:100%;border-radius:10px">`)}
function openChecklistDetail(id){const k=D.checklists.find(x=>x.id===id);if(!k)return;const v=V(k.vehicle_id)||D.myFleet.find(x=>x.id===k.vehicle_id)||{};
 const ph=p=>p?`<div class="thumbs"><img data-path="${esc(p)}" onclick="openPhoto(this.src)"></div>`:'';
 openModal(`<div class="row sp"><h3>Checklist · ${esc(v.plate||'')}</h3><button class="btn sm" onclick="closeModal()">✕</button></div>
 <p class="small">Veículo: <b>${esc(v.plate||'')}</b> · ${esc(v.model||'')}<br>Motorista: <b>${esc(k.driver_name||pName(k.inspected_by))}</b>${k.driver_email?' · '+esc(k.driver_email):''}${k.company_id?' · '+esc(D.companies.find(c=>c.id===k.company_id)?.name||''):''}<br>Enviado em ${fmtDT(k.created_at)} · período programado: ${fmtD(k.due_date)}${k.on_schedule?'':' (feito fora do dia)'}<br>${esc(v.model||'')} · KM informado: <b>${fmtKm(k.km_declared??k.km)}</b>${k.km!==(k.km_declared??k.km)?` (corrigido para ${fmtKm(k.km)})`:''}</p>
 ${k.km_flag?`<div class="warnbox">KM menor que o último registrado. Justificativa: ${esc(k.km_justification||'-')}</div>`:''}
 ${k.fuel_ok===false?'<div class="warnbox"><b>Solicitar abastecimento:</b> o motorista informou combustível abaixo de 1/4.</div>':''}
 ${Object.keys(k.photos||{}).length?`<div class="small mut">Vistas externas (frente · lateral esquerda · traseira · lateral direita)</div><div class="thumbs">${['frente','lat_esq','traseira','lat_dir'].filter(a=>k.photos[a]).map(a=>`<img data-path="${esc(k.photos[a])}" title="${a}" onclick="openPhoto(this.src)">`).join('')}</div>`:''}
 <div class="card tw"><table><tr><th>Item</th><th>Avaliação</th><th>Observação / fotos</th></tr>${NITEMS.map(([c,l])=>{const x=(k.items||{})[c]||{};return`<tr><td>${esc(l)}</td><td><span class="badge ${(ITS[x.status]||['b-mut','-'])[0]}">${(ITS[x.status]||['','-'])[1]}</span></td><td>${esc(x.note||'')}${(x.photos||[]).map(p=>ph(p)).join('')}${c==='oleo_motor'?'<div class="small mut">Foto do óleo:</div>'+ph(k.oil_photo):''}${c==='radiador'?'<div class="small mut">Foto da água:</div>'+ph(k.water_photo):''}</td></tr>`}).join('')}</table></div>
 ${k.notes?`<p class="small">Observações gerais: ${esc(k.notes)}</p>`:''}<p class="small mut">As fotografias são evidência; a avaliação é a informada pelo motorista.</p>`)}
/* ---- formulário ---- */
function openChecklist(vid){const list=isS()?NCHK():D.myFleet,v=vid?list.find(x=>x.id===vid):null;
 if(vid&&!v)return toast('Escolha um veículo da frota NOSBEB.');
 CK={id:uuid(),v,views:{frente:null,lat_esq:null,traseira:null,lat_dir:null},base:{},km:'',just:'',items:Object.fromEntries(NITEMS.map(([k])=>[k,{status:'',note:'',photos:[]}])),water:null,oil:null,fuel:null,notes:'',saved:false};closeModal();go('chkForm');ckLoadBase()}
VIEWS.chkForm=()=>{if(!CK)return isNosbebDriver()?VIEWS.nosbeb():VIEWS.checklist();const v=CK.v||{},t=today(),due=lastDue(t),list=isS()?NCHK():D.myFleet,co=D.companies.find(c=>c.id===(ME.company_id||v.company_id)),low=CK.km!==''&&v.km_current!=null&&Number(CK.km)<Number(v.km_current);
 const slot=(k,l,hint)=>`<div style="margin-top:8px"><b>${l} *</b> <span class="small mut">${hint}</span><div class="imgbox" style="margin:6px 0;max-width:320px">${CK[k]?`<img src="${CK[k]}">`:'<div class="empty">sem foto</div>'}</div><div class="row"><button class="btn sm pri" onclick="ckShoot('${k}')">📸 ${CK[k]?'Refazer':'Fotografar'}</button><button class="btn sm" onclick="ckPick('${k}')">🖼 Escolher do aparelho</button>${TESTB()?`<button class="btn sm ghost" onclick="ckTest('${k}')">🧪 foto de teste</button>`:''}</div></div>`;
 return`<div class="row sp"><h2>Checklist NOSBEB</h2><button class="btn sm" onclick="CK=null;go(isNosbebDriver()?'nosbeb':'checklist')">← Voltar</button></div>
 <div class="card"><h3>Identificação</h3>
 <label style="margin-top:0">E-mail do motorista</label><input value="${esc(ME.email||'')}" placeholder="e-mail não cadastrado" disabled>
 <div class="f2"><div><label>Motorista</label><input value="${esc(ME.name)}" disabled></div><div><label>Empresa</label><input value="${esc(co?.name||companyName(v)||'')}" disabled></div></div>
 <div class="f2"><div><label>Data</label><input value="${fmtD(t)}" disabled></div><div><label>Período programado</label><input value="${fmtD(due)} (${WD[new Date(due+'T12:00:00').getDay()]})" disabled></div></div>
 <label>Placa e modelo do veículo *</label><select id="ckVeh" onchange="ckVeh(this.value)"><option value="">Selecione o veículo da frota NOSBEB</option>${list.map(x=>`<option value="${x.id}" ${x.id===v.id?'selected':''}>${esc(x.plate)} · ${esc(x.model)}${x.color?' ('+esc(x.color)+')':''}</option>`).join('')}</select>
 <label>Quilometragem de saída *</label><input id="ckKm" type="number" inputmode="numeric" value="${esc(CK.km)}" placeholder="${v.km_current!=null?'último registrado: '+v.km_current:'selecione o veículo'}" oninput="CK.km=this.value;ckKmHint()">
 <div id="ckKmWarn">${low?ckKmWarn():''}</div></div>
 <div class="card"><h3>Itens da inspeção</h3><p class="small mut">Avalie todos os itens. Para itens não conformes, descreva e, se possível, fotografe.</p>
 ${NITEMS.map(([k,l],i)=>{const s=CK.items[k];return`<div class="chk" style="display:block"><div class="row sp"><span><b>${i+1}.</b> ${esc(l)}</span><div class="seg"><button class="ok ${s.status==='conforme'?'on':''}" onclick="ckSet('${k}','conforme')">Conforme</button><button class="is ${s.status==='nao_conforme'?'on':''}" onclick="ckSet('${k}','nao_conforme')">Não conforme</button>${NA_OK.includes(k)?`<button class="${s.status==='na'?'on':''}" onclick="ckSet('${k}','na')">Não se aplica</button>`:''}</div></div>
  ${s.status==='nao_conforme'?`<div style="margin-top:6px"><textarea placeholder="Observação sobre: ${esc(l)}" oninput="CK.items['${k}'].note=this.value">${esc(s.note)}</textarea><div class="thumbs" style="margin:6px 0">${s.photos.map((p,j)=>`<img src="${p}" onclick="openPhoto(this.src)">`).join('')}</div><div class="row"><button class="btn sm" onclick="ckItemShoot('${k}')">📸 Foto da evidência</button><button class="btn sm" onclick="ckItemPick('${k}')">🖼 Escolher</button>${TESTB()?`<button class="btn sm ghost" onclick="ckItemTest('${k}')">🧪 foto de teste</button>`:''}</div></div>`:''}
  ${k==='oleo_motor'?slot('oil','🛢 Foto do óleo','vareta ou visor com o nível legível'):''}${k==='radiador'?slot('water','💧 Foto da água','reservatório do radiador com o nível visível'):''}</div>`}).join('')}</div>
 <div class="card"><h3>Fotos externas do veículo *</h3><p class="small mut">As 4 vistas são obrigatórias.${Object.keys(CK.base||{}).length?' Use a foto base (miniatura) como referência de enquadramento.':''}</p><div class="grid g2">${EXT.map(k=>{const a=ANGLES.find(x=>x.k===k);return`<div><b class="small">${esc(a.l.replace(/ \(.*\)/,''))}</b>${CK.base?.[k]?`<div class="small mut">Referência:</div><div class="thumbs"><img data-path="${esc(CK.base[k])}" onclick="openPhoto(this.src)"></div>`:''}<div class="imgbox" style="margin:6px 0;max-width:220px">${CK.views[k]?`<img src="${CK.views[k]}">`:'<div class="empty">sem foto</div>'}</div><div class="row"><button class="btn sm pri" onclick="ckViewShoot('${k}')">📸 ${CK.views[k]?'Refazer':'Fotografar'}</button><button class="btn sm" onclick="ckViewPick('${k}')">🖼</button>${TESTB()?`<button class="btn sm ghost" onclick="ckViewTest('${k}')">🧪</button>`:''}</div></div>`}).join('')}</div></div>
 <div class="card"><h3>Combustível</h3><b>O nível de combustível está adequado para uso?</b><div class="small mut">Critério mínimo: 1/4 do tanque.</div>
 <div class="seg" style="margin-top:6px"><button class="ok ${CK.fuel===true?'on':''}" onclick="CK.fuel=true;render()">Sim: igual ou superior a 1/4</button><button class="is ${CK.fuel===false?'on':''}" onclick="CK.fuel=false;render()">Não: inferior a 1/4</button></div>
 ${CK.fuel===false?'<div class="warnbox"><b>Solicitar abastecimento.</b> A gestão será avisada; nenhum abastecimento é registrado por você aqui.</div>':''}
 <label>Observações gerais</label><textarea oninput="CK.notes=this.value">${esc(CK.notes)}</textarea></div>
 <button class="btn pri big" onclick="ckSave()">✔ Enviar checklist</button>`};
function ckKmWarn(){return`<div class="warnbox">O KM informado é menor que o último registrado (${fmtKm(CK.v?.km_current)}). Confirme o valor ou justifique:<textarea placeholder="Justificativa (obrigatória)" oninput="CK.just=this.value">${esc(CK.just)}</textarea></div>`}
function ckKmHint(){const el=$('#ckKmWarn');if(!el)return;const low=CK.km!==''&&CK.v&&Number(CK.km)<Number(CK.v.km_current);if(low&&!el.innerHTML)el.innerHTML=ckKmWarn();if(!low)el.innerHTML=''}
function ckVeh(id){CK.v=(isS()?NCHK():D.myFleet).find(x=>x.id===id)||null;CK.base={};render();ckLoadBase()}
async function ckLoadBase(){if(!CK||!CK.v)return;const id=CK.v.id;try{const r=await api.rpc('vehicle_base_photos',{p_vehicle:id});if(CK&&CK.v?.id===id){CK.base=r[0]?.photos||{};render()}}catch(e){}}
async function ckViewShoot(k){const a=ANGLES.find(x=>x.k===k);let g=null;if(CK.base?.[k])try{g=await api.photoUrl(CK.base[k])}catch(e){}ckCap(a.l,a.t,src=>{CK.views[k]=src;render()},g)}
function ckViewPick(k){pickFile(src=>{CK.views[k]=src;render()})}
function ckViewTest(k){CK.views[k]=demoImage((CK.v?.plate||'teste')+'|'+k,'teste',{damage:'none'});render()}
function ckSet(k,s){CK.items[k].status=s;if(s!=='nao_conforme'){CK.items[k].note='';CK.items[k].photos=[]}render()}
const ckCap=(title,text,cb,ghost)=>capture(cb,ghost?{title,text,ghost}:{title,text});
function ckShoot(k){ckCap(k==='water'?'Foto da água':'Foto do óleo',k==='water'?'Enquadre o reservatório do radiador com o nível visível.':'Enquadre a vareta/visor com o nível do óleo legível.',src=>{CK[k]=src;render()})}
function ckPick(k){pickFile(src=>{CK[k]=src;render()})}
function ckTest(k){CK[k]=demoChkImage(k==='water'?'agua':'oleo',CK.v?.plate||'teste');render()}
function ckItemShoot(k){ckCap(itemLabel(k),'Fotografe a evidência da não conformidade.',src=>{CK.items[k].photos.push(src);render()})}
function ckItemPick(k){pickFile(src=>{CK.items[k].photos.push(src);render()})}
function ckItemTest(k){CK.items[k].photos.push(demoImage((CK.v?.plate||'teste')+'|lat_esq','teste',{damage:'small'}));render()}
async function ckSave(){const c=CK;if(!c)return;const km=Number(c.km);
 if(!c.v)return toast('Selecione o veículo da frota NOSBEB');
 if(c.km===''||isNaN(km)||km<0)return toast('Informe a quilometragem de saída');
 const low=c.v.km_current!=null&&km<Number(c.v.km_current);if(low&&!c.just.trim())return toast('KM menor que o último registrado: informe a justificativa');
 const miss=NITEMS.find(([k])=>!c.items[k].status);if(miss)return toast('Avalie todos os itens. Falta: '+miss[1]);
 if(!c.oil)return toast('Fotografe o óleo (item 13)');if(!c.water)return toast('Fotografe a água do reservatório (item 15)');
 const m4=EXT.find(k=>!c.views[k]);if(m4)return toast('Fotografe as 4 vistas externas. Falta: '+ANGLES.find(a=>a.k===m4).l.replace(/ \(.*\)/,''));
 if(c.fuel===null)return toast('Responda se o nível de combustível está adequado');
 busy(true,'Enviando fotos...');try{const base=`nosbeb/${c.v.id}/${c.id}`,wp=`${base}/agua.jpg`,op=`${base}/oleo.jpg`,items={};
  await api.upload(wp,await dataURLtoBlob(c.water));await api.upload(op,await dataURLtoBlob(c.oil));const photos={};for(const k of EXT){const p=`${base}/${k}.jpg`;await api.upload(p,await dataURLtoBlob(c.views[k]));photos[k]=p}
  for(const [k] of NITEMS){const s=c.items[k],ps=[];for(let i=0;i<s.photos.length;i++){const p=`${base}/item_${k}_${i+1}.jpg`;await api.upload(p,await dataURLtoBlob(s.photos[i]));ps.push(p)}items[k]={status:s.status,note:s.note.trim()||null,photos:ps}}
  busy(true,'Salvando checklist...');
  if(!c.saved){await api.insert('nosbeb_checklists',{id:c.id,vehicle_id:c.v.id,km,items,photos,fuel_ok:c.fuel,notes:c.notes.trim()||null,water_photo:wp,oil_photo:op,km_justification:low?c.just.trim():null});c.saved=true}
  toast(c.fuel===false?'Checklist enviado. Abastecimento solicitado à gestão.':'Checklist enviado ✔');CK=null;await loadData();go(isNosbebDriver()?'nosbeb':'checklist')}catch(e){toast(e.message,6000)}finally{busy(false)}}

/* ======================= EMPRESAS e fotografias ======================= */
function companyForm(id){const c=D.companies.find(x=>x.id===id)||{fleet_controls:false};
 openForm(id?'Editar empresa':'Nova empresa',[{n:'name',l:'Nome da empresa',req:1,full:1},{n:'fleet_controls',l:'Frota NOSBEB',cl:'Usa os controles da frota NOSBEB (abastecimento com litros/valor/km, checklist de terça e quinta)',t:'check',full:1}],c,o=>id?api.update('companies',id,o):api.insert('companies',o))}
VIEWS.empresas=()=>{const sel=typeof VARG==='string'&&VARG?VARG:'all',vs=D.vehicles.filter(v=>sel==='all'||(sel==='none'?!v.company_id:v.company_id===sel)).sort((a,b)=>a.plate.localeCompare(b.plate)),cnt=id=>D.vehicles.filter(v=>id==='none'?!v.company_id:v.company_id===id).length;
 AFTER.push(()=>loadCompanyPhotos(vs));
 return`<div class="row sp"><h2>Veículos por empresa</h2>${isG()?`<button class="btn pri" onclick="companyForm()">+ Empresa</button>`:''}</div>
 <div style="margin-bottom:6px"><span class="chip ${sel==='all'?'on':''}" onclick="go('empresas','all')">Todas (${D.vehicles.length})</span>${D.companies.map(c=>`<span class="chip ${sel===c.id?'on':''}" onclick="go('empresas','${c.id}')">${esc(c.name)} (${cnt(c.id)})${c.fleet_controls?' · NOSBEB':''}</span>`).join('')}<span class="chip ${sel==='none'?'on':''}" onclick="go('empresas','none')">Sem empresa (${cnt('none')})</span></div>
 ${isG()&&sel!=='all'&&sel!=='none'?`<div class="row" style="margin-bottom:8px"><button class="btn sm" onclick="companyForm('${sel}')">Editar empresa</button></div>`:''}
 ${isG()?'':'<div class="infobox" style="margin:0 0 12px">As fotografias dos veículos são visíveis apenas ao gestor de frota.</div>'}
 ${vs.map(v=>{const [l,c]=vehNow(v);return`<div class="card"><div class="row sp"><div><b>${esc(v.plate)} · ${esc(v.model)}</b> <span class="badge ${c}">${esc(l)}</span> ${companyName(v)?`<span class="tag2">🏢 ${esc(companyName(v))}</span>`:'<span class="tag2">sem empresa</span>'}${isFleetV(v)?' <span class="tag2">NOSBEB</span>':''}<br><span class="small mut">${esc(v.vehicle_type||'')} · ${fmtKm(v.km_current)} · ${gauge(Number(v.fuel_level))}</span></div>
 ${isG()?`<div class="row"><button class="btn sm" onclick="go('hist','${v.id}')">📸 Vistorias</button><button class="btn sm" onclick="vehForm('${v.id}')">Editar</button></div>`:''}</div>
 ${isG()?`<div class="thumbs" id="ph_${v.id}" style="margin-top:8px"><span class="small mut">carregando fotos...</span></div>`:''}</div>`}).join('')||'<div class="card mut">Nenhum veículo nesta seleção.</div>'}`};
async function loadCompanyPhotos(vs){if(!isG())return;
 await Promise.all(vs.map(async v=>{const el=document.getElementById('ph_'+v.id);if(!el)return;let h='';
  try{const r=(await api.rpc('reference_inspection',{p_vehicle:v.id}))[0];if(r)h+=`<div style="width:100%" class="small mut">Última vistoria (${r.kind==='retirada'?'retirada':'devolução'}) · ${fmtDT(r.created_at)}</div>`+Object.values(r.photos||{}).map(p=>`<img data-path="${esc(p)}" onclick="openPhoto(this.src)">`).join('')}catch(e){}
  const k=D.checklists.find(x=>x.vehicle_id===v.id);if(k)h+=`<div style="width:100%" class="small mut">Último checklist NOSBEB · ${fmtDT(k.created_at)} · água e óleo</div><img data-path="${esc(k.water_photo)}" title="Água" onclick="openPhoto(this.src)"><img data-path="${esc(k.oil_photo)}" title="Óleo" onclick="openPhoto(this.src)">`;
  el.innerHTML=h||'<span class="small mut">Sem fotografias registradas.</span>'}));hydrate()}

/* ======================= DIVERGÊNCIAS (quilometragem e horários × programado) ======================= */
function computeDivergences({bk,ins,rf,ck,from}){const DV=CONFIG.DIVERGENCE,out=[],add=(sev,type,o)=>out.push({sev,type,...o}),inP=t=>!from||t>=from,H=m=>fmtDur(Math.abs(m)/60);
 for(const b of bk){if(['cancelada','recusada'].includes(b.status))continue;const est=b.est_km!=null&&b.est_km!==''?Number(b.est_km):null,h=hrs(b.start_at,b.end_at),base={booking:b.id,vid:b.vehicle_id,when:b.start_at};
  if(est&&h>0&&est/h>DV.MAX_AVG_KMH)add('warn','programado',{...base,text:`Programado: ${est} km em ${fmtDur(h)} (média de ${Math.round(est/h)} km/h, acima de ${DV.MAX_AVG_KMH} km/h). Confira a distância e os horários da solicitação.`});
  if(b.km_start!=null&&b.km_end!=null){const real=b.km_end-b.km_start;
   if(real<0)add('bad','km',{...base,text:`KM final (${b.km_end}) menor que o inicial (${b.km_start}).`});
   else if(est){const tol=Math.max(DV.KM_ABS,est*DV.KM_PCT/100),diff=real-est;if(Math.abs(diff)>tol)add(Math.abs(diff)>2*tol?'bad':'warn','km',{...base,text:`Rodou ${real} km; programado ${est} km (${diff>0?'+':''}${diff} km, tolerância de ${Math.round(tol)} km).`})}}
  if(b.started_at){const m=(new Date(b.started_at)-new Date(b.start_at))/6e4;if(Math.abs(m)>DV.TIME_MIN)add('warn','horario',{...base,text:`Retirada ${H(m)} ${m>0?'depois':'antes'} do horário programado (${fmtDT(b.start_at)}).`})}
  if(b.returned_at){const m=(new Date(b.returned_at)-new Date(b.end_at))/6e4;if(m>DV.TIME_MIN)add('warn','horario',{...base,text:`Devolução ${H(m)} depois do horário programado (${fmtDT(b.end_at)}).`});else if(m<-DV.TIME_MIN)add('info','horario',{...base,text:`Devolução ${H(m)} antes do horário programado (${fmtDT(b.end_at)}).`})}
  else if(b.status==='em_uso'&&(Date.now()-new Date(b.end_at))/6e4>DV.TIME_MIN)add('bad','horario',{...base,text:`Ainda em uso, ${H((Date.now()-new Date(b.end_at))/6e4)} depois do retorno programado (${fmtDT(b.end_at)}).`})}
 const rd={},push=(vid,km,at,src,booking)=>{if(vid&&km!=null)(rd[vid]=rd[vid]||[]).push({km:Number(km),at,src,booking})};
 ins.forEach(i=>push(i.vehicle_id,i.km,i.created_at,i.kind==='retirada'?'vistoria de retirada':'vistoria de devolução',i.booking_id));rf.forEach(r=>push(r.vehicle_id,r.km,r.created_at,'abastecimento'));ck.forEach(c=>push(c.vehicle_id,c.km,c.created_at,'checklist NOSBEB'));
 for(const [vid,L] of Object.entries(rd)){L.sort((a,b)=>a.at<b.at?-1:a.at>b.at?1:0);let mx=null,prev=null;
  for(const x of L){if(mx&&x.km<mx.km&&inP(x.at))add('bad','odometro',{vid,booking:x.booking,when:x.at,text:`KM ${x.km} (${x.src}) menor que o registro anterior: ${mx.km} (${mx.src}, ${fmtDT(mx.at)}).`});
   if(!mx||x.km>mx.km)mx=x;
   if(prev&&prev.src==='vistoria de devolução'&&x.src==='vistoria de retirada'&&x.booking!==prev.booking&&x.km-prev.km>DV.KM_GAP&&inP(x.at))add('warn','odometro',{vid,booking:x.booking,when:x.at,text:`Retirada com ${x.km} km, ${x.km-prev.km} km acima da última devolução (${prev.km} km): possível uso sem registro.`});
   prev=x}}
 consumptionSeries(rf).filter(c=>c.kml!=null&&inP(c.created_at)).forEach(c=>{const v=V(c.vehicle_id);if(!v)return;const ref=Number(c.fuel_type==='alcool'?v.kml_alcool:v.kml_gasolina);
  if(ref&&c.kml<ref*(1-CONFIG.CONSUMPTION_ALERT_PCT/100))add('warn','consumo',{vid:c.vehicle_id,when:c.created_at,text:`Consumo de ${c.kml} km/L, ${Math.round((1-c.kml/ref)*100)}% abaixo do cadastrado (${ref} km/L).`})});
 return out.sort((a,b)=>({bad:0,warn:1,info:2}[a.sev]-{bad:0,warn:1,info:2}[b.sev])||(a.when<b.when?1:-1))}
VIEWS.divergencias=()=>{const r=VARG&&VARG.from?VARG:{from:addDays(today(),-30),to:today()},DV=CONFIG.DIVERGENCE;AFTER.push(()=>loadDiv(r));
 return`<h2>Divergências de quilometragem e horários</h2>
 <div class="infobox" style="margin:0 0 12px">Compara o <b>programado</b> (horários e km da solicitação) com o <b>realizado</b> (retirada, devolução, hodômetro das vistorias, abastecimentos e checklists). São <b>indícios para conferência</b>, não conclusões. Tolerâncias atuais: ±${DV.KM_PCT}% ou ${DV.KM_ABS} km na distância · ${DV.TIME_MIN} min nos horários · ${DV.KM_GAP} km entre a devolução e a próxima retirada · média máxima de ${DV.MAX_AVG_KMH} km/h no programado (ajuste em <code>CONFIG.DIVERGENCE</code>).</div>

 const [bk,ins,rf,ck]=await Promise.all([api.select('bookings',{f:[['gte','start_at',f],['lte','start_at',t]],order:'start_at'}),api.select('inspections',{f:W('created_at'),order:'created_at'}),api.select('refuels',{f:W('created_at'),order:'created_at'}),api.select('nosbeb_checklists',{f:W('created_at'),order:'created_at'})]);
 const L=computeDivergences({bk,ins,rf,ck,from:f}),n=s=>L.filter(x=>x.sev===s).length,SB={bad:['b-bad','Crítico'],warn:['b-warn','Atenção'],info:['b-info','Info']};

 <div class="card tw"><table><tr><th>Data</th><th>Gravidade</th><th>Tipo</th><th>Veículo</th><th>Divergência</th></tr>${L.map(x=>`<tr><td>${fmtDT(x.when)}</td><td><span class="badge ${SB[x.sev][0]}">${SB[x.sev][1]}</span></td><td>${DVT[x.type]}</td><td><b>${esc(V(x.vid)?.plate||'')}</b></td><td>${esc(x.text)}${x.booking?` <a href="#" onclick="openBookingAny('${x.booking}');return false">ver reserva</a>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">Nenhuma divergência no período.</td></tr>'}</table></div>`}catch(e){$('#divOut').innerHTML=`<div class="badbox">${esc(e.message)}</div>`}}
